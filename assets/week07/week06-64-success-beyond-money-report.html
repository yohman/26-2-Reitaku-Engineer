<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>64人のお金じゃない成功</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --ink:#1d2433; --muted:#5d6475; --line:#e6e2da;
  --coral:#e2553a; --coral-soft:#fde8e2; --teal:#1b7f79; --teal-soft:#ddf1ee;
  --gold:#c98a14; --violet:#6c4fb3; --night:#141a28; --night-ink:#f3f1ec;
  --shadow:0 6px 24px rgba(29,36,51,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1a2130; --ink:#eef0f4; --muted:#a3abbb; --line:#2c3446;
    --coral:#ff7a5c; --coral-soft:#3a2420; --teal:#43c1b7; --teal-soft:#16302f;
    --gold:#e7b04a; --violet:#a58cf0; --night:#0b0f18; --night-ink:#f3f1ec;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1a2130; --ink:#eef0f4; --muted:#a3abbb; --line:#2c3446;
  --coral:#ff7a5c; --coral-soft:#3a2420; --teal:#43c1b7; --teal-soft:#16302f;
  --gold:#e7b04a; --violet:#a58cf0; --night:#0b0f18; --night-ink:#f3f1ec;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h2{font-size:clamp(24px,3.4vw,36px);line-height:1.35;margin:0 0 8px;font-weight:900;letter-spacing:.01em}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--coral);margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 28px;max-width:720px}
section{padding:72px 0}
section+section{border-top:1px solid var(--line)}

/* hero */
.hero{position:relative;background:var(--night);color:var(--night-ink);min-height:640px;overflow:hidden;padding:0}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:relative;z-index:2;padding:84px 20px 40px;max-width:1080px;margin:0 auto;pointer-events:none}
.hero .copy *{pointer-events:auto}
.hero .tag{display:inline-block;font-size:13px;letter-spacing:.12em;color:#ffb39f;border:1px solid rgba(255,179,159,.4);border-radius:999px;padding:4px 14px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.2;margin:18px 0 12px;font-weight:900}
.hero h1 em{font-style:normal;color:#ff8a6b}
.hero p{max-width:520px;color:#c9cdd8;margin:0 0 22px}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:#ff8a6b;color:#1b1310}
.btn.ghost{background:transparent;color:var(--night-ink);border:1px solid rgba(255,255,255,.35);margin-left:8px}
.hero .hint{position:absolute;z-index:2;left:0;right:0;bottom:84px;text-align:center;font-size:13px;color:#8d94a6}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:280px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;box-shadow:var(--shadow);opacity:0;transition:opacity .15s}
.tip b{color:var(--coral)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-56px;position:relative;z-index:3}
.stat{background:var(--surface);border-radius:16px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.stat .num{font-size:clamp(30px,4.4vw,44px);font-weight:900;line-height:1.1;color:var(--coral)}
.stat .num small{font-size:16px;margin-left:2px;color:var(--ink)}
.stat .lbl{font-size:13px;color:var(--muted);margin-top:4px}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:220px 1fr 54px;gap:12px;align-items:center;cursor:pointer;border-radius:10px;padding:6px 8px;transition:background .2s}
.bar:hover,.bar.on{background:var(--teal-soft)}
.bar .name{font-weight:700;font-size:15px;line-height:1.45}
.bar .track{height:26px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:6px;background:var(--teal);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bars.gold .fill{background:var(--gold)}
.bar.hot .fill,.bars.gold .bar.hot .fill{background:var(--coral)}
.bar .cnt{font-weight:900;font-size:18px;text-align:right}
.callout{display:flex;gap:18px;align-items:center;background:var(--coral-soft);border-radius:16px;padding:20px 22px;margin:26px 0 0}
.callout .big{font-size:44px;font-weight:900;color:var(--coral);line-height:1;white-space:nowrap}
.drawer{margin-top:18px;display:none}
.drawer.open{display:block}
.drawer h3{font-size:16px;margin:0 0 10px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mini .m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;cursor:pointer}
.mini .m .id{font-size:12px;color:var(--muted);font-weight:700}

/* flips */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.flip{perspective:1000px;height:270px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.flip .f{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.flip .b{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip .q{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.flip .b .q{color:rgba(255,255,255,.75)}
.flip .t{font-size:22px;font-weight:900;line-height:1.45}
.flip .n{font-size:13px}
.flip .n b{font-size:30px;font-weight:900;margin-right:4px}
.flip .tap{font-size:12px;color:var(--muted)}

/* question wall */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:4px;font-weight:500}
.qwall{columns:3 260px;column-gap:14px}
.qc{break-inside:avoid;display:inline-block;width:100%;margin:0 0 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;cursor:pointer}
.qc.hide{display:none}
.qc .qt{font-family:"Shippori Mincho",serif;font-weight:700;font-size:16.5px;line-height:1.7}
.qc .qt::before{content:"Q.";font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;color:var(--coral);margin-right:6px}
.qc .qm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:700}
.qc .cat{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:1px 9px}
.qc .full{display:none;margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px}
.qc.open .full{display:block}

/* stairs */
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}
.step{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;outline:2px solid transparent;transition:outline-color .2s}
.step:hover,.step.on{outline-color:var(--ink)}
.step:nth-child(1){margin-top:110px}
.step:nth-child(2){margin-top:55px}
.step .lv{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.step .nm{font-size:22px;font-weight:900;margin:2px 0}
.step .d{font-size:13px;color:var(--muted);line-height:1.6;min-height:42px}
.step .ct{font-size:40px;font-weight:900;line-height:1.1;margin-top:8px;color:var(--teal)}
.step:nth-child(3) .ct{color:var(--coral)}
.step .ct small{font-size:15px;color:var(--ink);margin-left:2px}
.step .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.step .dots span{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.step:nth-child(3) .dots span{background:var(--coral)}
.note{font-size:14px;color:var(--ink);background:var(--teal-soft);border-radius:14px;padding:14px 18px;margin-top:22px}

/* voices */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.vc{background:var(--surface);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.vc .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.vc .badge{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:2px 10px}
.vc blockquote{margin:0;font-family:"Shippori Mincho",serif;font-size:20px;line-height:1.7;font-weight:700}
.vc blockquote::before{content:"“";color:var(--coral);font-size:30px;margin-right:2px}
.vc .cm{font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px}
.vc .cm::before{content:"読みどころ　";font-weight:900;color:var(--coral);font-size:12.5px}
.vc button{align-self:flex-start;font:inherit;font-size:13px;background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:0}
.vc .full{display:none;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.vc.open .full{display:block}

.close{background:var(--night);color:var(--night-ink);text-align:center}
.close h2{font-size:clamp(26px,4vw,42px)}
.close p{color:#c9cdd8;max-width:640px;margin:10px auto 0}
.close .kicker{color:#ff8a6b}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px;text-align:left}
.qs div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 18px;font-size:15px}
.qs b{display:block;color:#ff8a6b;font-size:13px;margin-bottom:4px}
.foot{font-size:12.5px;color:var(--muted);padding:28px 0 48px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s, transform .8s}
.reveal.in{opacity:1;transform:none}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .flips{grid-template-columns:1fr}
  .stairs{grid-template-columns:1fr}
  .step:nth-child(n){margin-top:0}
  .vgrid{grid-template-columns:1fr}
  .qs{grid-template-columns:1fr}
  .bar{grid-template-columns:130px 1fr 40px}
  .bar .name{font-size:13px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero" id="top">
  <canvas id="sky"></canvas>
  <div class="copy">
    <span class="tag" id="tag"></span>
    <h1 id="h1"></h1>
    <p id="intro"></p>
    <button class="btn" id="gather">ひとつに集める</button><button class="btn ghost" id="scatter">ばらばらに戻す</button>
  </div>
  <div class="hint">↓ 下へ進むと、全体の傾向と、ていねいに読みたい声があります</div>
  <div class="tip" id="tip"></div>
</header>

<div class="wrap">
  <div class="stats reveal" id="stats"></div>
  <div id="main"></div>
</div>

<section class="close">
  <div class="wrap">
    <div class="kicker">次の問い</div>
    <h2 id="closeH"></h2>
    <p id="closeP"></p>
    <div class="qs" id="closeQs"></div>
  </div>
</section>
<div class="wrap foot" id="foot"></div>

<script>
const DATA = {"meta": {"tag": "麗澤流エンジニア 2026｜第6回レポート 全体分析", "h1": "64人の、<br><em>お金じゃない成功</em>。", "intro": "シータラム博士の講義のあとに書いた感想と質問。64人分、20,889字を読みました。光の一つ一つが、一人のレポートです。触れると、その人が持ち帰ったことが見えます。", "shape": "drop"}, "stats": [{"n": 64, "lbl": "提出（情報システム工学 46／ロボティクス 18）"}, {"n": 13, "lbl": "が「お金を儲ける＝成功、ではない」に触れた"}, {"n": 17, "lbl": "が博士への質問を書いた"}, {"n": 1, "lbl": "だけが「人生の4分の1を教育に費やすのはよくない」と書いた"}], "students": [{"id": "01", "dept": "情報", "imp": ["I", "D"], "crit": ["eco", "life"], "vision": "インフラの進化の結果的には健康から教育、仕事、GDPなどいろいろな面の進化ににかかわってくる", "text": "シータラムさんの話を聞いて感じたことはインフラの進化の結果的には健康から教育、仕事、GDPなどいろいろな面の進化ににかかわってくるということを感じました。また問題の発見から解決策を見つけ実践するこれを発見から繰り返すという問題の解決に大切であることから戻ってみることも大事であると感じました。問題を解決したいときは関連するような成功例、または似たような成功例を探してそこから学ぶのも大切であると感じました。"}, {"id": "03", "dept": "情報", "imp": ["W", "P", "$"], "crit": [], "vision": "自分も技術を学ぶだけでなく、それを社会にどう役立てられるかを考えていきたいと思った", "text": "今回の講義を聞いて、エンジニアにとって大切なのは、技術や知識だけではなく、それを使って社会の問題を解決しようとする姿勢だと感じた。特に、シーサ・ラム博士が水やトイレなど、世界が抱える問題の解決に取り組んできたことが印象に残った。また、必ずしも勉強が得意であることや、お金があることだけが成功につながるわけではなく、自分のアイデアや行動、人間性によって大きなことを成し遂げられるのだと思った。今回の講義を通して、自分も技術を学ぶだけでなく、それを社会にどう役立てられるかを考えていきたいと思った。"}, {"id": "04", "dept": "ロボ", "imp": ["$", "P", "R"], "crit": ["eco"], "vision": "次回からは、気になった言葉に印を付けて、聞きながら質問を考えるようにし、自分から積極的に参加できる受講を心がけたいです", "text": "シータラムさんの講義で印象に残ったのは、「お金が儲かる=成功ではない」という考えと、能力だけでなくオリジナリティやパッションが貢献に必要だという話です。新幹線が移動の便利さだけでなく国の経済発展にも影響するという視点も新鮮で、インフラの価値を見る目が変わりました。一方で、メモを取ることに集中しすぎて、質問の時間に考えがまとまらず、質問できなかったことが心残りです。次回からは、気になった言葉に印を付けて、聞きながら質問を考えるようにし、自分から積極的に参加できる受講を心がけたいです。"}, {"id": "05", "dept": "情報", "imp": ["X"], "crit": [], "vision": "人によって物事の考え方や感じ方が違うため、さまざまな人の意見を聞くことが大切だと思いました", "text": "今回、シータラムさんのお話を聞いて、自分とは違う経験や考え方を知ることができました。私は、人によって物事の考え方や感じ方が違うため、さまざまな人の意見を聞くことが大切だと思いました。また、新しいことを学ぶためには、自分から興味を持ち、行動することも必要だと感じました。私はまだ大学1年生なので、これからの大学生活で多くの知識や経験を身につけたいです。特に、自分が興味を持っている分野について積極的に学び、将来に役立てたいと考えています。また、シータラムさんがこれまでの経験の中で、特に大変だったことや、それをどのように乗り越えたのかについて質問してみたいです。"}, {"id": "06", "dept": "ロボ", "imp": ["Q"], "crit": [], "vision": "他人と自分を比べすぎず、自分なりの幸せを見つけることも大切だと思う", "text": "シータラムさんの話を聞いて、幸福な人生を送るためには、お金や物の豊かさだけでなく、毎日を楽しく過ごせる環境や人間関係を大切にすることが必要だと思う。例えば、家族や友人との時間を大切にしたり、自分の好きなことや趣味に取り組んだりすることで、日々の生活に充実感が生まれると思う。また、勉強や仕事などで目標を持ち、少しずつ努力して達成していくことも幸福につながると考える。さらに、他人と自分を比べすぎず、自分なりの幸せを見つけることも大切だと思う。人生には大変なことや思い通りにならないこともあるが、その中でも前向きに考え、周りの人への感謝を忘れずに生活していきたい。こうした日々の小さな幸せを積み重ねることが、幸福な人生につながると思う。"}, {"id": "07", "dept": "ロボ", "imp": ["Q"], "crit": [], "vision": "人生もシステム設計に似ているということです", "text": "エンジニアリングと人生のQOLの話を聞いて気づいたのは、人生もシステム設計に似ているということです。完璧を目指すより、小さく作って改善を重ねるほうが続きます。睡眠や運動といった土台が崩れると、どんなに優れた技術も活きません。QOLは「余白」から生まれるとも感じました。常に全力で稼働させず、休む時間や人との関わりにリソースを割くことで、長く健やかに働けます。自分は毎日少しづつ楽しいと思えるような経験を積んでいきたいと思いました"}, {"id": "08", "dept": "情報", "imp": ["L"], "crit": [], "vision": "英語の壁に苦戦しながらも最後まで諦めずに耳を傾けた甲斐があり", "text": "英語でのお話だったため、終始内容を理解し続けるのはとても大変で苦労しました。しかし、お相手は非常に素晴らしい経歴をお持ちの第一人者であり、そのような方から直接生のお話を聞くことができたのは、滅多にない本当に貴重な体験となりました。英語の壁に苦戦しながらも最後まで諦めずに耳を傾けた甲斐があり、自分の視野や価値観が大きく広がるような強い刺激と学びを得ることができました。これからの糧となる、大変実り多き有意義な時間となりました。"}, {"id": "09", "dept": "情報", "imp": ["E", "T"], "crit": [], "vision": "今後はただチームを作るのではなく、互いに信頼出来る、高めあえる仲間を意識してチームを作りたいです", "text": "自分の研究を進めることよりも次の若者を育てることが重要だと言っていたことが印象に残りました。若者を育てた方が社会が成長するのは分かりますが、自分のやりたい研究をやらずに若者を育てる決断が出来るのはすごいなと思いました。また、成功への道はひとりではダメで、お互いを高めあえるチームが必要と話していた事も印象に残りました。今後はただチームを作るのではなく、互いに信頼出来る、高めあえる仲間を意識してチームを作りたいです。"}, {"id": "12", "dept": "情報", "imp": ["G", "W", "D"], "crit": ["pol", "life"], "vision": "まず誰がどんな場面で困っているのかを具体的に考え、実際に使う人の意見を取り入れながら案を見直したいです", "text": "今回の講義では、シーサ・ラム博士が地理情報システム（GIS）の研究から、水や衛生の問題、インドの高速鉄道計画、教育支援まで、さまざまな分野に関わってきたことを学びました。特に印象に残ったのは、安全な水やトイレを使える環境を広げるために、政府や企業、地域社会が協力するという話です。水やトイレは普段の生活で当たり前のように使っていますが、それを多くの人に届けるには、設備を作る技術に加えて、誰が管理し、どう使い続けられるようにするかまで考える必要があると感じました。\nまた、スタンフォードでのデザイン思考の話で、試作品がうまくいかなければ前の段階に戻って考え直すという点も心に残りました。何かを作っていると、完成を急ぐあまり、最初に決めた方法にこだわってしまうことがあります。しかし、実際に使う人の反応を見て、そもそも解決しようとしている問題の捉え方が合っていたかを振り返ることで、より使いやすいものに近づけると思いました。\n今回の講義を通して、技術の価値は、それを使う人の生活がどう変わるかにも表れると感じました。私も大学の課題などで身近な問題の改善策を考えるときには、まず誰がどんな場面で困っているのかを具体的に考え、実際に使う人の意見を取り入れながら案を見直したいです。"}, {"id": "13", "dept": "情報", "imp": ["R", "C"], "crit": [], "vision": "自分もたくさんのことに挑戦して自分にしかできないことを見つけていきたい", "text": "新幹線の話であったり、ほかにもいろいろな話を聞いてたくさんのことに挑戦をしていて自分もたくさんのことに挑戦して自分にしかできないことを見つけていきたいと思ったのともっと深く話を聞いてみたいと感じました。自分だったらこれは無理でしょみたいなことをシータラムさんはやっていてどうしたらそういう挑戦をしようと思って挑戦することができるのかまた、どういう思いでやって、やっている時の思いを聞いてみたいと思いました。"}, {"id": "15", "dept": "ロボ", "imp": ["E"], "crit": [], "vision": "今のエンジニアを作るうえでとても大切な内容だなと思いました", "text": "今回のシータラムさんの話を聞いて自分は今の教育体制にあまり関心がなかったのですが話を聞いているうちにいろいろな教育の仕方があったり、今のエンジニアを作るうえでとても大切な内容だなと思いました。自分を今後考えていくうえで今回のシータラムさんんのお話はとても大事な内容だと思ったし教育に関して改めていろいろと考えさせられるようなお話でした自分はもっとエンジニアとして成長していかなければいけないのでもっと頑張りたいなと思いました"}, {"id": "17", "dept": "情報", "imp": ["C", "G", "W", "E"], "crit": [], "vision": "実際に手を上げなければならないというのも感じたことです", "text": "どうすればエンジニアは社会に貢献できるかということでお話をしていただきました。まず、経歴が東大に行き、就職した上でアジア開発銀行に行く事になったという部分でGisの更新のため二週間で行き来していたのかという点で驚きました。今だとgooglemapなどでも3d表示されますし、Gisもたくさんあります。そのパイオニアだった点も素晴らしいと思いますし、そのような功績を認められたからこそ認められていた部分もあるのだと思います。そのころの、地図の作り方が数式的にずれを作り、コーディングだけで作っていたという点でも驚きました。その後水の評価？、分析などをされていたと思うのですがそのなかで出てきたトイレ充足率50%という数字も衝撃的でした。よく考えてみれば、上下水道の整備などが出来ないと実現しにくいことから、難しかったのだろうとも感じます。Lkyで教授になってからはとても教育に力を入れていた点もひろいけの考えに近いなと思います。最後に授業では質問をしないのは失礼というお話が有りましたが、たしかに善意でお話頂いているのでコメントだけでなく、なかなか難しいですが、実際に手を上げなければならないというのも感じたことです。"}, {"id": "18", "dept": "情報", "imp": ["B", "R", "E"], "crit": ["sym"], "vision": "学校教育や社会教育において一番大切なことは学び続けたいという考え方がとても重要になっていくことだと思いました", "text": "アイデアだけががたくさんあっても、ビジネスを継続し続けることは難しいことや、新幹線を通すということはただの交通網の整備ということだけではなく、日本やインドのオリンピックに合わせるように開発することで、新幹線開通がその国の発展のシンボル的な存在の一つになるということを学びました。また、今後のAIがどれほど発展しても、学校教育や社会教育において一番大切なことは学び続けたいという考え方がとても重要になっていくことだと思いました。"}, {"id": "19", "dept": "情報", "imp": ["R"], "crit": [], "vision": "たくさんの人々の希望に応えようとするマインドは私が楽しいイラストを描いて人々を喜ばせようとする心理と似ている", "text": "シータラムさんは人をもてなすことに情熱を注ぐエンジニアだった。彼はいつかインドでオリンピックが開催されることになった時に、インドに日本の新幹線のような高速鉄道を開通することを望んでいることが分かった。彼の話を聞いて、たくさんの人々の希望に応えようとするマインドは私が楽しいイラストを描いて人々を喜ばせようとする心理と似ている、と感じた。もしいつかインドでオリンピックが開かれたら彼の鉄道に関する熱い情熱を尊敬したいと思う。"}, {"id": "20", "dept": "ロボ", "imp": ["C", "G", "D"], "crit": [], "vision": "私にとっては結果が未知の状態は最初のうちにきっちりプランを作らないと安心できないのですが、そこを超える力がkeシータラム博士にあると感じ、勇気をもらいました", "text": "keシータラム博士の話を聞いて。私にとって博士や研究者のイメージは気難しいように感じていたのですが、keシータラム博士は気さくで冒険心のあるような印象でした。日本に来た時に日本語を勉強せずに来たエピソードやもともと教授になる予定はなかったと聞き、良い印象に聞こえにくいかもしれませんが、良い意味で明確な予定を持っていないように思いました。日本語を勉強したタイミングや成功例を調べて学ぶなどの必要になったタイミングで勉強するというのが新しいものを作るうえで不可欠の柔軟性が表れていました。「昔は地図をコードで作る際は黒と緑のテキストだけだったため、印刷するまで正しいかわからない状態だった。」というエピソードにも共通しますが、私にとっては結果が未知の状態は最初のうちにきっちりプランを作らないと安心できないのですが、そこを超える力がkeシータラム博士にあると感じ、勇気をもらいました。冒険心の様な点においては会社を転々としたアリーシャさんともどこか似ていると感じました。"}, {"id": "21", "dept": "情報", "imp": ["C", "R", "I"], "crit": ["eco", "safe", "env", "fund"], "vision": "インフラは私たちの日常生活を支えるだけでなく、国や地域の将来にも大きな影響を与える重要なものだと改めて感じました", "text": "シータラムさんのお話を聞いて30年以上にわたり国際開発に携わってきた経験の豊富さに驚きました。特に、東日本旅客鉄道株式会社など私たちも知っている会社とのインド高速鉄道に関する特別顧問を務めていることが印象に残りました。鉄道は人々の移動を便利にするだけでなく、地域をつなぎ、経済の発展や観光の活性化にもとても関係していると思います。また、高速鉄道の整備には多くの技術や資金が必要であり、安全性や環境への配慮も重要になると感じました。日本の鉄道技術やインフラ整備の知識が海外でも活用されていることは、とても興味があります。さらに、インフラ整備は鉄道や道路をつくることだけではなく、水政策や都市開発など、人々が安心して暮らせる環境を整えることにもつながっています。今回のプロフィールを通して、インフラは私たちの日常生活を支えるだけでなく、国や地域の将来にも大きな影響を与える重要なものだと改めて感じました。"}, {"id": "22", "dept": "ロボ", "imp": ["D", "R"], "crit": ["eco"], "vision": "頭の中で完璧な正解を求めるのではなく、失敗や他者の成功例から粘り強く学び、考え、何度もプロトタイプを繰り返す柔軟な実践こそが必要なのだと強く実感できました", "text": "<感想・感じたこと>\nシータラムさんの話を聞いて印象に残った点は、社会を改善していくためのポリシーと、世の中をよくするためにどんなフレームワークを作る必要があるのか、という点です。\nまずその手順として、①問題を把握する、②正解を探す、③ソリューションを実現（自分のプロトタイプを実現）させるというものがあり、特に③の自分のプロトタイプを実現させるのは一番難しいということが知れました。\n次に、何かアイデアを考えつき、それが正解と思ってプロトタイプを作ってみても大体はよくないデザインになって振り出しに戻ってしまうことも多々あるが、それこそが大切なプロセスになり、いいデザインが生まれる可能性がある。さらに、何かこうしたいと思ったなら、まずは成功例（サクセスストーリー）を見てみて、何か学びを得ることも必要ということを学べました。\nまた、インドの新幹線プロジェクトの話の中の、技術がもたらす社会的インパクト（影響）と、それによる社会変化の見通し、そのインパクトを可視化するための地図作成、国家の未来を形作る仕事に関わることへの喜びを聞いて、シータラムさんの研究開発における心意気などを知れ、学びになりました。\n最後に、これらの学びから、頭の中で完璧な正解を求めるのではなく、失敗や他者の成功例から粘り強く学び、考え、何度もプロトタイプを繰り返す柔軟な実践こそが必要なのだと強く実感できました。\n自分の目的を見失わず、成功の裏にある無数の試行錯誤を恐れない姿勢をよく覚えておき、自分も社会の課題解決への貢献、やってみたいことができる実践的な力を養うため、これから頑張っていきたいです。\n\n<質問>\n実際の現場にいると、どうしても最初から正解に近いものを作ろうとして手が止まってしまったり、作ったプロトタイプが失敗だったときにどこをどう修正すべきか迷ってしまったりすることがありそうなのですが、まずプロトタイプを作る際に意識していることや、失敗したプロトタイプから改善のヒントを見つけ出すために、シータラムさんはどのような基準で評価・観察されているのかが気になりました。"}, {"id": "23", "dept": "ロボ", "imp": ["D"], "crit": [], "vision": "設計やアイデア出しにおいては技術的な実現可能性だけでなく、使いやすさや独自性といった多角的な視点を持つことが不可欠であると学びました", "text": "今回の授業を通して、単に知識や技術を学ぶだけでなく、その背景にある課題意識やユーザー視点、そして具現化に向けた思考プロセスを深く捉えることの重要性を実感しました。\n特に、現状の問題点に対してどのようにアプローチし、どのような工夫やアイデアを盛り込むべきかという議論や考察が非常に刺激的でした。細かな注意点や改善策を整理していく中で、設計やアイデア出しにおいては技術的な実現可能性だけでなく、使いやすさや独自性といった多角的な視点を持つことが不可欠であると学びました。今後の課題制作やプロジェクトにおいても、今回整理した思考プロセスを意識し、より説得力のある提案や質の高い成果物の作成につなげていきたいです。"}, {"id": "24", "dept": "情報", "imp": ["$"], "crit": [], "vision": "現実にはお金や利益を優先する考え方も多く、社会全体の価値観を変えていくことは簡単ではないと思います", "text": "成功というと、一般的にはお金持ちになることや、社会的な地位を得ることをイメージしがちですが、人々の生活を豊かにしたり、お金では測れない価値を生み出したりすることも、一つの大きな成功だというお話に大変共感しました。私自身も、お金を得ることだけを目的とするのではなく、人が抱えている悩みや苦しみを少しでも減らし、多くの人が幸せに暮らせる社会をつくることに価値を感じています。しかし、現実にはお金や利益を優先する考え方も多く、社会全体の価値観を変えていくことは簡単ではないと思います。そこで質問なのですが、より多くの人が目先の利益やお金だけを追い求めるのではなく、他者の幸せや社会全体を豊かにすることにも価値を感じ、行動するようになるためには、どのような意識改革や取り組みが必要だと考えますか。また、そうした考え方を社会に広めていくために、私たち一人ひとりにできることは何でしょうか。"}, {"id": "28", "dept": "情報", "imp": ["I"], "crit": ["eco", "fund", "fair"], "vision": "インフラを評価するときは「どれだけ速いか」だけでなく、「利益が誰に、どれだけ公平に届いたか」まで見ることが大切だと考えた", "text": "インフラの成果は、速さや費用だけでなく、その周りの地域や人の暮らしがどう変わったかという「波及効果」でも評価できると感じた。例えば高速鉄道ができると、移動時間が短くなるだけでなく、駅の周りに店や会社が集まり、雇用が増え、土地の価値や税収も上がる。博士は、こうして生まれた利益の一部をインフラの資金に回す考え方を紹介していて、技術と資金と暮らしがつながっていることが分かった。\n\nでは、これは誰にとっての利益なのか。乗客や沿線の企業だけでなく、税収が増える自治体や、その税で公共サービスを受ける住民全体にも利益が広がると思う。一方で、駅から遠い地域や土地を持たない人には利益が届きにくく、家賃の上昇などで負担だけが増える可能性もある。そのため、インフラを評価するときは「どれだけ速いか」だけでなく、「利益が誰に、どれだけ公平に届いたか」まで見ることが大切だと考えた。"}, {"id": "29", "dept": "ロボ", "imp": ["Q", "P"], "crit": [], "vision": "納得のいく人生には、技術と倫理の両輪が必要だと確信いたしました", "text": "寿命の長短にかかわらず、自らの選択に納得して歩むことこそがQOLや幸福度を高めるのだと感じます。また「技術や知識だけでは世界に貢献できない」という言葉通り、高度な技術も倫理観がなければ人を傷つけ、逆に理想だけでは現実を守れません。納得のいく人生には、技術と倫理の両輪が必要だと確信いたしました。\n冒頭でGISと3Dメガネを用い、壁一面に広がるビジュアルを作成された意図や狙いは何でしょうか。\n倫理観を重視されるシータラムさんが、エンジニアリングの世界を選ばれた理由をお聞かせください。"}, {"id": "32", "dept": "ロボ", "imp": ["W", "R", "D", "E", "$"], "crit": ["sym"], "vision": "社会の質や人とのつながり、次の世代への投資に目を向けられる人間性を磨いていきたいと強く思った", "text": "シーサラムさんの多様なキャリアと、世界規模の課題に対する深い洞察、そして人間性に基づいた行動力について学ぶ、非常に刺激的な時間だった。\nまず、シーサラムさんの、「世界の諸問題は遡れば皆水に行き着く」という旨の言葉が強く心に残った。2007年当時、人類の3分の1が安全な水を使えず、半分が安全なトイレを持っていなかったという現実に対し、研究するだけでなく「世界トイレデー（トイレサミット）」を立ち上げ、政府・社会・企業を巻き込んで公衆衛生の改善を進めるという行動力に驚いた。ご本人は「エリートコースを知らなかった」「自分のことを良い生徒だと思っていなかった」と語られていた記憶があるが、既存の枠組みから抜け出しつつ、課題に実直に向き合う姿勢はエリートとして活動する以上のすばらしさがあると思った。\nまた、2013年から関わっているというインド初の新幹線プロジェクトのお話も興味深かった。新幹線開通がその国において機能以上のシンボリックな意味（オリンピックのジンクスなど）を持つという視点は、インフラが社会に与える心理的な影響の大きさを物語っていると思った。ここで紹介されたスタンフォード大学のデザイン思考（ヘビモチーフのフレームワーク）における「プロトタイプが必ずしも良いものになるとは限らないため、常に前のフレームを振り返る」という考え方は、今後の学生生活において非常に実践的で役立つアプローチだと感じた。(実際例年にはデザイン思考Bがある。)\n最後に、講義の終盤で投げかけられた「AIが発達する時代における教育のあり方」や「人生の4分の1を教育制度の中で過ごす意味」という問いは、まさに今を生きる私たちへの重要なメッセージであると思う。洋先生が「シーサラムさんは水より教育にパッションがあるように見える」「人間性ですごいことができるモデル」と評されていた通り、フィリピンでのボランティア学校設立など、シーサラムさんの情熱は常に「次のリーダーを育てること」に向いているように感じた。\n「お金じゃないところに価値を見出せる、これを成功と考えるのがいいのではないか」という博士の言葉の通り、単に技術的な正解を追い求めるだけでなく、社会の質や人とのつながり、次の世代への投資に目を向けられる人間性を磨いていきたいと強く思った。"}, {"id": "35", "dept": "情報", "imp": ["I", "Q", "P"], "crit": ["pol", "fund", "life"], "vision": "技術と倫理の両方を大切にし、人々の幸福や暮らしをより良くするために技術を活用することが、これからのエンジニアに必要なのだと感じました", "text": "シータ・ラムさんの話を聞いて、技術を発展させることだけでなく、それが人々の生活にどのような影響を与えるのかを考えることが大切だと感じました。高速鉄道や水、都市の整備などのインフラは、技術だけで成り立つものではなく、公共政策や投資、実際に利用する人々の生活まで考える必要があるという点が印象に残りました。また、寿命が長いことが必ずしも幸福につながるわけではなく、自分が納得できる人生を送れるかどうかも重要だと思いました。さらに、知識や技術があっても、それを正しく使うための人格や倫理観がなければ、誰かを傷つけてしまう可能性があります。技術と倫理の両方を大切にし、人々の幸福や暮らしをより良くするために技術を活用することが、これからのエンジニアに必要なのだと感じました。"}, {"id": "37", "dept": "情報", "imp": ["X"], "crit": [], "vision": "今回の授業を通して、自分が恵まれていることのありがたさを改めて感じました。", "text": "今回の授業でシータラムさんのお話を聞いて、普段あまり関わることのない方の話を聞くことができ、とても貴重な経験になりました。話を聞く中で、自分では考えたことのなかったことや、新しく気づかされることがあり、とても興味深かったです。また、自分の考えを広げるきっかけにもなったと思います。最初は少し難しく感じる部分もありましたが、最後まで話を聞くことで、さまざまなことを知ることができました。今回の授業を通して、自分が恵まれていることのありがたさを改めて感じました。"}, {"id": "39", "dept": "情報", "imp": ["C", "I"], "crit": ["fund", "pol"], "vision": "インドの高速鉄道プロジェクトや水の安全保障といった巨大な事業を成功に導く背景には、知識の共有と組織的な学習が不可欠であると理解できました", "text": "今回の授業で、国際開発におけるインフラ整備の「持続可能性」と「制度設計」の重要性を深く学ぶことができた。シータ教授が30年以上ものキャリアの中で、アジア全域における交通や水、都市開発などのインフラ整備に関与していたことに衝撃を受けました。\n　特に印象的だったのは、単に構造物を作るだけでなく、エビデンスに基づいた意思決定や、民間・慈善活動の資金を呼び込む仕組みを構築するという先駆的な視点です。\n　インドの高速鉄道プロジェクトや水の安全保障といった巨大な事業を成功に導く背景には、知識の共有と組織的な学習が不可欠であると理解できました。\n　グローバルな課題に対して先見の明を持ち、ローマクラブ正会員としても認められている教授の講義は、今後の国際社会におけるインフラのあり方と、今後私たちが担うべき役割を再認識するきっかけにもなりました。\n　また、一つ質問なのですが、グローバルな課題と向き合う中で、「一番重要だと感じていること」あるいは「課題に対して解決に近づいてきたときにうれしいと感じること」ってなにかあったりしますか？"}, {"id": "41", "dept": "情報", "imp": ["$"], "crit": [], "vision": "ゼミのグループや会議などでアイデアを出して発散し、少しでも方向を変えたりできたらより良い人生になるなと感じました", "text": "大切なのは高い給料を求めるのではなく、この世の中をどのくらい変えられたかが重要と言う言葉がとても深いなと感じました。通学中や家族会話などで、高い給料の話などをよく耳にしますが、それにより本当に幸せになれるのかは自分次第です。しかし、私は世の中をより良い方向に変えたほうが幸せになれるような気がします。世の中というと少し規模がデカすぎるように感じますが、ゼミのグループや会議などでアイデアを出して発散し、少しでも方向を変えたりできたらより良い人生になるなと感じました。"}, {"id": "42", "dept": "情報", "imp": ["L", "P"], "crit": [], "vision": "授業で学んでいることが将来どのように仕事につながるのかを意識しながら、少しずつ知識や技術を身につけていきたいと思いました", "text": "日本語で話してほしかったです。\nシーラタムさんのお話を聞いて、エンジニアという仕事は、ただプログラミングをしてシステムを作るだけではないのだと感じました。技術的な知識やスキルはもちろん大切ですが、それ以上に、問題が起きたときに原因を考えたり、周りの人と協力しながら解決したりする力も必要なのだと思いました。また、IT業界は技術の進歩がとても速いため、一度知識を身につけて終わりではなく、新しい技術を学び続ける姿勢が重要だと感じました。私は大学で情報システムについて学んでいますが、まだ分からないことも多く、プログラミングにも難しさを感じています。今回のお話をきっかけに、授業で学んでいることが将来どのように仕事につながるのかを意識しながら、少しずつ知識や技術を身につけていきたいと思いました。"}, {"id": "43", "dept": "情報", "imp": ["I", "P"], "crit": ["fund", "pol", "life"], "vision": "どんなにすごい技術があっても、それを支えるお金の仕組みや政府のルール、そして実際にそこで暮らす人たちの協力がないと意味がない", "text": "シータラムさんの話を聞いて、エンジニアの仕事は単に新しい技術や建物をつくるだけではないんだなと強く感じました。高速鉄道や水の問題、防災といった大きなテーマにおいて、どんなにすごい技術があっても、それを支えるお金の仕組みや政府のルール、そして実際にそこで暮らす人たちの協力がないと意味がないという話がとても印象的でした。\n特に、土地の価値が上がることを利用して維持費などをまかなう考え方や、人々の行動を自然に促す工夫（ナッジ）の話は今まで考えたことがなかったので新鮮でした。これからは技術の勉強だけでなく、それが社会や人々の生活にどう役立つのかまで考えられるエンジニアを目指したいです。"}, {"id": "44", "dept": "情報", "imp": ["E", "$", "P", "D"], "crit": [], "vision": "お金ではなく、人が「ギブ」し合うことで成り立つ仕組みがあるのだと驚いた", "text": "シータラムさんの話で一番心に残ったのは、奥様とフィリピンで学校を作り、学生は無料で、20年以上続いているという話だった。お金を出したのは土地代と先生の給料だけで、校舎のペンキ塗りなどは親たちがボランティアで支えているという。お金ではなく、人が「ギブ」し合うことで成り立つ仕組みがあるのだと驚いた。\n\nまた、「お金を儲ければ成功」ではなく「世の中を良くすれば成功」という価値観に変えたいという話も印象的だった。私はどこかで、成功とは良い会社に入って稼ぐことだと思っていた。しかしシータラムさんは、お金目的ではない精神で育ったリーダーが増えれば、世の中は良くなると考えている。それを話すだけでなく、実際に学校という形で実践しているところに説得力を感じた。\n\n工学部の学生として考えさせられたのは、技術的なスキルだけでは社会に貢献できず、人格やパッション、コミュニケーションも同じくらい大事だという話だ。プログラミングができることだけをゴールにせず、学んだことを社会に返すという学びのサイクルを意識したいと思った。マニラの水道の成功例のように、まず成功例から学ぶという姿勢も、これからのグループプロジェクトで実践してみたい。"}, {"id": "45", "dept": "情報", "imp": ["W", "$", "R", "D", "P"], "crit": ["sym"], "vision": "人々の生活の質を向上させることが真の成功や「共生」に繋がるのだと再認識させられました", "text": "今回のシータラムさんのお話を通じて、エンジニアとしての技術力や専門知識だけでなく、社会に対する強い情熱や視点の多様性こそが世界を動かす原動力になるのだと強く感じました。   特に印象的だったのは、世界の水問題や公衆衛生に対する取り組みと、政府・社会・企業を結びつけて解決を目指す姿勢です。博士ご自身が「お金のため」ではなく、純粋な社会的課題の解決やボランティア精神に基づき活動されている点が非常に感銘深く、人々の生活の質を向上させることが真の成功や「共生」に繋がるのだと再認識させられました。   また、インドの新幹線プロジェクトのお話における「機能性以上のシンボリックな価値」という捉え方や、スタンフォード大学のデザイン思考のフレームワークなど、常に試行錯誤を繰り返しながらより良い課題解決を目指すプロセスも大変学びになりました。"}, {"id": "47", "dept": "ロボ", "imp": ["I"], "crit": ["eco", "life", "fair"], "vision": "高速鉄道が整備されても、利用できる人とできない人の間で格差が生まれる可能性もあると考えました", "text": "今回の講義を通して、インフラ整備の成功は、建設費や移動速度だけで判断するものではないと感じました。例えば、高速鉄道が整備されることで、移動時間が短縮されるだけでなく、地域の経済活動が活発になったり、人々の生活が便利になったりすることも重要だと思います。\n一方で、高速鉄道が整備されても、利用できる人とできない人の間で格差が生まれる可能性もあると考えました。\nそこで質問なのですが、インフラ整備によって生まれる地域間の格差を減らすためには、どのような取り組みが必要なのでしょうか。"}, {"id": "50", "dept": "情報", "imp": ["I"], "crit": ["disas", "life"], "vision": "長持ちすることや使いやすさを考えて作られたインフラから一番メリットを受けるのは、そこで毎日暮らす地域の人たちです", "text": "道路や電車、水などのインフラを作るときは早く安く作れるかだけで成功かどうかを決めるべきではないと思います。   たとえば地震や大雨などの災害が起きても壊れにくい建物や水道を作ったり、使う人の毎日の生活のしやすさを考えて計画したりすることがとても大切です。もし安さや速さだけを優先して作ってしまうと大きな災害が起きたときにすぐに壊れて生活が止まってしまったり、住んでいる人が使いにくくて困ったりするからです。   このように長持ちすることや使いやすさを考えて作られたインフラから一番メリットを受けるのは、そこで毎日暮らす地域の人たちです。災害が起きても安心して暮らすことができ、毎日の移動や生活も便利になるからです。 \n【質問したいこと】\n安全で丈夫なインフラを作るにはお金がかかると思いますが、お金があまりない国や地域に広がっていくためにはどんな工夫が必要でしょうか？"}, {"id": "53", "dept": "情報", "imp": ["$", "E", "W", "D"], "crit": [], "vision": "失敗から愚直に問題の再定義へと戻るデザイン思考を実践したりする姿勢には、私が今後社会に出た際に見習いたい姿勢だと思う", "text": "単なる経済的な富を増やすことではなく、質素さや社会貢献を成功の指標とする新しい価値観の提案や、フィリピンでの学校設立といった次世代へのギブの循環は教育者としてのシーサランさんの生き方を考えされられた。自らの専門知識を単なる個人のキャリア形成で終わらせず、次の世代のリーダー育成や社会システムの改善へと循環させていく姿勢は、一介の技術者であるより社会に貢献できる行き方だと思う。私たちが生まれた年の頃は世界の約半数の人々が自宅にまともなトイレを持てず野外で用を足さざるを得なかったという現実や、3分の1の人々が安全な水を得られなかったという話は日本に生まれた幸せを再確認出来たし、技術や資金だけでは解決できない現場の課題に対して、ステークホルダーの認識を変える「政策」の視点を取り入れたり、失敗から愚直に問題の再定義へと戻るデザイン思考を実践したりする姿勢には、私が今後社会に出た際に見習いたい姿勢だと思う。"}, {"id": "54", "dept": "情報", "imp": ["D", "$"], "crit": [], "vision": "まずは実際にやってみることが重要だと感じた", "text": "今回の授業を聞いてかなり難しい内容だったけど自分でも少し理解できるところが何個かあった。特に自分の考えを形にするというところがすでに何度かいろいろな授業でやったところだったから理解ができた。プロトタイプを完成させるためにいろいろな失敗をしたりひらめきがあると思うけどそれぞれが大切なプロセスだと考えるとまずは実際にやってみることが重要だと感じた。SDGsの問題はかなり前からあり授業の課題などで調べたりして解決策をいろいろと考えているがいまだに解決が出来ていないところを見るととても難しい問題なんだと改めて思った。成功とお金が必ずしも結びつくものではないという考え方はあまりしたことがなかったから世の中を良くすれば成功と考えられる世の中にしたいというのはとても素晴らしいことだと感じた。"}, {"id": "55", "dept": "情報", "imp": ["W"], "crit": [], "vision": "生活環境や文化の違いによる根本的な認識の違いは意識しないと配慮できないなと思いました", "text": "公衆衛生に関して、日常的に衛生的な環境で過ごしている人間と、日常的に不衛生な環境で済んでいる人間では、衛生観念に違いが出るのは考えてみれば当然のことであり、そこにおいてステークホルダー間での認識や優先順位の違いが出たことは仕組みのデザインにおいてわかりやすい良い例・示しであった。確かにステークホルダー間の認識の違いは今まで立場の違い（ユーザーと設計者、依頼者のそれぞれの視点や利益の違い）から起きるものだと思っていたが、生活環境や文化の違いによる根本的な認識の違いは意識しないと配慮できないなと思いました。"}, {"id": "56", "dept": "情報", "imp": ["Q"], "crit": [], "vision": "100歳まで葛藤しながら生き続ける中にこそ、人間的な深みや人生の後半で予期せぬ変化や素敵な出会いが訪れる余地が存在します", "text": "QOLと寿命の話を聞き、「納得がいかない時間」が持つ価値について深く考えさせられました。65歳で満足して人生を終えるのも魅力的ですが、100歳まで葛藤しながら生き続ける中にこそ、人間的な深みや人生の後半で予期せぬ変化や素敵な出会いが訪れる余地が存在します。幸福度というものは技術と倫理のバランスだけではなく、こうした「長い時間の経過によってじっくり熟成されていくもの」もまた、人生の価値を大きく左右する非常に重要な要素なのではないでしょうか。"}, {"id": "57", "dept": "情報", "imp": ["C", "E", "P"], "crit": [], "vision": "自分も専門知識を身につけるだけでなく、それを社会のために役立てられる人材になりたいと感じました", "text": "今回の講義を聞いて、シータラムさんが国際的な視点で社会の課題に向き合っていることが印象に残りました。特に、技術や知識だけでなく、それらを社会のためにどう活用するかが重要であるという考え方に共感しました。また、講義後に調べてみると、シータラムさんは東京大学の客員教授やアジア開発銀行研究所（ADBI）のフェローとして活動しており、インフラ整備や人材育成にも携わっていることが分かりました。世界規模で活躍している方でありながら、次世代の教育にも力を入れている点が印象的でした。今回の講義を通して、自分も専門知識を身につけるだけでなく、それを社会のために役立てられる人材になりたいと感じました。"}, {"id": "58", "dept": "情報", "imp": ["I"], "crit": ["pol", "life"], "vision": "インフラが単なる構造物ではなく、人々の生活と社会構造をつなぐ「架け橋」であると実感させられました", "text": "今回のK. E. Seetha Ramさんの講義からは、インフラが単なる構造物ではなく、人々の生活と社会構造をつなぐ「架け橋」であると実感させられました。高速鉄道や水路、レジリエントな都市づくりは、工学の領域を超え、政策や投資、そして現場で暮らす人々の日常と密接にかかわっているなと感じました。技術・経済・人間を中心とした包括的な視点によって、未来の社会基盤はどうあるべきかという本質的な課題を深く考えさせられました。また、銀行の話など多くのことを話していただきました。"}, {"id": "59", "dept": "情報", "imp": ["Q", "P", "G"], "crit": [], "vision": "「技術（知識・スキル）」と「倫理（志・人格）」が揃って初めて、人々のQOL（生活の質）を高める土台ができるのだと深く納得しました", "text": "シータラム先生の研究や講義を通して、「技術（知識・スキル）」と「倫理（志・人格）」が揃って初めて、人々のQOL（生活の質）を高める土台ができるのだと深く納得しました。\n先生が取り組まれるGIS（地理情報システム）や3Dメガネを用いた大画面の可視化技術は、データや被害予測を専門家だけのものにせず、地域の人々と視点を一致させて対話するために設計されています。これは「技術の使い方を間違えず、人のために正しく役立てる」という強い倫理的軸があってこその工夫です。\n単に長く生きることや技術を誇示することが目的ではなく、自分が持つスキルを他者や世界のためにどう活かし、納得のいく結果を残せるか。技術者としての高度な専門性と、人間としての倫理観を統合して社会に貢献するシータラム先生の姿勢は、私たちが目指すべき「納得感のある幸福な生き方」の模範だと感じています。"}, {"id": "60", "dept": "ロボ", "imp": ["C", "X"], "crit": [], "vision": "日常の常識に疑問を投げかけている感じでとても興味深い内容だった", "text": "東大に行っていたのにそれが凄いことだと思っていなかったことに驚いた。また海外の日本とはまったく違う日常やビジネスの常識などでカルチャーショックを受けた。普通に生活していたら今回の内容を知ることはなかったと思うので、今回の講義を受けれてとても良かったと思っている。SDGsがゴールポストが変わっただけというのはすごく核心をついて老いるなと思った。日常の常識に疑問を投げかけている感じでとても興味深い内容だった。"}, {"id": "61", "dept": "情報", "imp": ["Q", "$"], "crit": [], "vision": "幸せについても、お金だけを基準にするのではなく、人それぞれの価値観や生活環境など、複数の視点から考える必要があると感じました", "text": "今回のシータラムさんの話を聞いて、幸せになるためにはお金も大切だが、お金だけでは本当の幸せは得られないということを学びました。お金があれば生活を便利にしたり、欲しいものを手に入れたりできますが、それだけで心が満たされるわけではないと思いました。家族や友人との人間関係、自分の好きなことに取り組む時間、人とのつながりも幸せには必要だと感じました。また、工学的思考の視点から考えると、物事を一つの視点だけで判断するのではなく、さまざまな条件や問題を考え、より良い解決方法を見つけることが大切だと思います。幸せについても、お金だけを基準にするのではなく、人それぞれの価値観や生活環境など、複数の視点から考える必要があると感じました。今回の話を通して、自分にとっての幸せとは何かを考えながら、大学生活でもさまざまな経験を大切にしていきたいです。"}, {"id": "64", "dept": "情報", "imp": ["E", "W", "T"], "crit": [], "vision": "自分の成果だけを考えるのではなく、周囲の人と協力しながら、将来につながる行動をすることが大切だと感じました", "text": "シーラームさんのお話を聞いて、環境問題を解決するためには、研究を進めるだけでなく、次の世代に知識や経験を伝えていくことも大切だと感じました。特に水に関する問題は、一人の力だけで解決することが難しく、多くの人が協力する必要があると思いました。また、チームで何かに取り組む際には、お互いの意見を尊重し、信頼関係を築くことが重要だと学びました。今回のお話を通して、自分の成果だけを考えるのではなく、周囲の人と協力しながら、将来につながる行動をすることが大切だと感じました。"}, {"id": "65", "dept": "情報", "imp": ["P", "T"], "crit": [], "vision": "成功は一人だけで実現できるものではなく、お互いに刺激を与え、高めあえる仲間やチームの存在が大切だと学んだ", "text": "今回の講義を聞いて、成功するためには知識やスキルだけでなく、人柄も情熱も同じくらい大切だと感じた。特に周りの人を動かすためには、その人自身のパーソナリティーも重要だとという話が印象に残った。また、成功は一人だけで実現できるものではなく、お互いに刺激を与え、高めあえる仲間やチームの存在が大切だと学んだ。これからの大学生活を送る中でも、自分の能力を伸ばすだけでなく、周りの人との関わりも大切にしていきたいと感じた講義でした。"}, {"id": "67", "dept": "情報", "imp": ["I"], "crit": ["safe"], "vision": "時速1500キロでも10回に1回事故が起こるようではインフラとしては成立しませんが、300キロでも安心して使えるのならばそちらのほうが良い", "text": "インフラはその重要性に反して軽視されがちですが、人の命をつなぐ非常に重要な役目を担っている...これは当たり前のことですが、忘れがちになってしまうので、シータラムさんのように実際に携わっている方に話を聞けたのは、矢張りそういった大切なことを思い出すうえで非常に参考になりました。\nインフラというのは、利便性もそうですが...最も大切なのは、安全性だと考えます。鉄道で例えれば、時速1500キロでも10回に1回事故が起こるようではインフラとしては成立しませんが、300キロでも安心して使えるのならばそちらのほうが良い、ということでしょう。\n\n質問としては、「地方の公共交通は鉄道もバスも問題を抱えているが、第三の道はあるのか？」といったところです。"}, {"id": "69", "dept": "情報", "imp": ["B"], "crit": [], "vision": "技術を社会で活用していくためには経営の知識も必要なのだと感じました", "text": "今回の講義で興味を持ったのは、スタートアップ企業についての話です。良いアイデアがあっても、資金が足りなかったり、お金の使い方が分からなかったりして倒産してしまう企業があるという話が印象に残りました。私はITパスポートという国家資格を取得しようと考えているのですが、その試験には経営に関する内容も含まれています。今回の話を聞いて、ITと経営は別々のものではなく、技術を社会で活用していくためには経営の知識も必要なのだと感じました。"}, {"id": "70", "dept": "情報", "imp": ["G"], "crit": [], "vision": "今の環境に感謝して揃っている環境を活用することでより効率の良い学びを得られるように頑張ろうと思いました", "text": "私がシータラムさんの話を聞いて思ったことは現代がいかに恵まれているかということです。途中で例として出た３D眼鏡を使って浮き出る地形図を作る際には途中で結果を確認することもできず、印刷するまでわからないという環境で制作していたそうで、さらにインターネットに関してもまだほとんどない時代だったので知識を集めるのも簡単だったそうです。なので今の環境に感謝して揃っている環境を活用することでより効率の良い学びを得られるように頑張ろうと思いました。"}, {"id": "72", "dept": "情報", "imp": ["D", "E"], "crit": [], "vision": "「成功例から探してアイデアを形にしていく」という考えを自分も実践したいと思います", "text": "自分は何か新しいものを作ろうと必死になって案だけが溜まってしまい、形にするまでがなかなかできていないので、今回お話しにあった「成功例から探してアイデアを形にしていく」という考えを自分も実践したいと思います。\n自分は教育の重要性は最も優先するべきものであると考えているので、教育の場を設けて、その機会があることは多くの人にとって素晴らしいものになると思いました。自分もこのような取り組みを考えてみたいです。\n \n \n今までで最も難しかった仕事や高かった壁はなんでしたか？\nまた、チームで活動する際で心がけていることは何ですか？"}, {"id": "75", "dept": "情報", "imp": ["I", "Q", "P"], "crit": ["safe", "env", "life"], "vision": "インフラには速さや費用以外に、やはり安全性や環境への配慮も重要だと思った。", "text": "インフラには速さや費用以外に、やはり安全性や環境への配慮も重要だと思った。\nそしてそれにより社会全体のQOLが上がることが重要だと分かった。\nまた人格も大事だと知ってそういうところもしっかり心がけようと思った\n実際のエンジニアからの色々な話を通じてエンジニアの核の部分を色々知ることができた。\n自分がかなり興味のある分野なのでかなり興味深かった\nこれからもエンジニアについて様々なことを学んでいきたいと思った。"}, {"id": "77", "dept": "情報", "imp": ["I"], "crit": ["fair", "life", "safe", "env"], "vision": "インフラプロジェクトの成功は、工事の速さや費用だけでなく、完成後にどれだけ人々の暮らしを豊かにできたかで判断するべきだと思う", "text": "インフラプロジェクトが成功しているかどうかは、工事が予定通りに終わったか、予算内に収まったかだけでは判断できないと思う。例えば、高速鉄道が完成して移動時間が短くなったとしても、運賃が高すぎて一部の人しか利用できなければ、本当に成功したとは言い切れない。反対に、建設に時間や費用がかかったとしても、多くの人が便利に利用でき、地域の発展にもつながっていれば、長い目で見て成功したと考えられる。\n\n特に大切なのは、そのインフラを実際に利用する人たちの生活がどう変わったかという点だと思う。便利さだけでなく、安全性や利用しやすさ、環境への影響なども考える必要がある。また、都市部に住む人だけでなく、地方に住む人や高齢者など、さまざまな立場の人が恩恵を受けられることも重要だと感じる。\n\nこのように、インフラプロジェクトの成功は、工事の速さや費用だけでなく、完成後にどれだけ人々の暮らしを豊かにできたかで判断するべきだと思う。"}, {"id": "79", "dept": "ロボ", "imp": ["L"], "crit": [], "vision": "麗澤大学の先生以外の人から話を聞ける機会はあまりなく", "text": "前回と同様に英語はほとんど聞き取れなかったが、日本語で話している部分があったため、聞き取れる部分は前回よりも多かった。しかし、個人的に前回に比べて理解しにくい内容が多く、難しい話であると感じる部分が多々あった。麗澤大学の先生以外の人から話を聞ける機会はあまりなく、普段の講義とは異なる内容や話題に触れることができるため、前回、今回ともに貴重な機会であると感じた。また、授業予定では今後もゲストから話を聞くことができる機会があると書いてあったため、今後もこのような機会を大切にしていきたい。"}, {"id": "80", "dept": "ロボ", "imp": ["R"], "crit": ["sym"], "vision": "各国の新幹線が開通した年は全てオリンピックが開催される年だったという話がとても興味深く感じました", "text": "私は今回の講習でシータラムさんの話を聞いて思ったことは、各国の新幹線が開通した年は全てオリンピックが開催される年だったという話がとても興味深く感じました。なぜ、この話が私にとっても興味を持たせたのかを考えました。各国の新幹線がオリンピックの年に開通したのは偶然ではないと、最初に聞いた時に私はそう感じたからです。各国がオリンピックの年に新幹線の開通をしたのかの理由を考察してみました。オリンピックが開催されることで様々な国から人が来ることにより、より速くより多くの人が一回の移動で動ける移動手段が必要であり、それが新幹線の開通につながったのではないかと考察しました。"}, {"id": "81", "dept": "情報", "imp": ["X"], "crit": [], "vision": "「知らない人と喋って、友達になれた」や「ゼミで、みんなで協力して、良い展示をできた」などの良い成功体験を重ねることができている", "text": "シータラムさんのお話で多く出てきたのが「成功体験」だった。僕はあまり良い成功体験を感じたことがない。ズル休みできたことや上手く嘘をつけたことなどの悪い成功体験しか感じたことがない。でも大学に来て、「知らない人と喋って、友達になれた」や「ゼミで、みんなで協力して、良い展示をできた」などの良い成功体験を重ねることができている。これを糧に、最近の自分は精力的だ、と自分に自信を持って活動できるようになってきた。"}, {"id": "84", "dept": "情報", "imp": ["D", "$", "P"], "crit": [], "vision": "それぞれの個人のニーズに寄り添い、その人にとっての「幸せの形」を届けられるような価値あるモノづくりをしていきたいです", "text": "シータラムさんの講演を通して、世の中を良くするための実践的なフレームワークと、社会に価値を提供する人間の在り方について多くの学びを得ました。\n特に私の関心を惹いたのは、問題解決に向けたプロセスです。「何が問題なのかを正確に把握して正解を探すこと」、そして「プロトタイプを作ってもバッドソリューションであれば結局振り出し（1）に戻る可能性があること」、「成功例を探すことが成功のヒントになること」というお話がありました。これはまさに、私が目指しているエンジニアの実務やマインドセットに通ずる非常に重要な姿勢だと感じました。失敗を恐れずに試行錯誤を繰り返し、本質的な課題解決に向き合うことの重要性を再認識しました。\nまた、成功や価値に対する考え方にも強く共感しました。成功＝お金を持つことと思いがちですが、お金以外の部分にいかに価値を生み出せるかが本来の正解であるという言葉は非常に印象的でした。一つの技術ができるだけでは社会に貢献するには不十分であり、そこに本人の人間性やパッションが伴うことが不可欠なのだと学びました。\n「私たちが世の中を変えられることにビリーフ（信念）を持っている」というシータラムさんの強い思いを受け、私も自分の技術で社会に貢献したいという思いを新たにしました。多様性が尊重される現代において、人生の成功や幸せの形は決して1つではありません。私はエンジニアとして、単にシステムを作るだけでなく、それぞれの個人のニーズに寄り添い、その人にとっての「幸せの形」を届けられるような価値あるモノづくりをしていきたいです。"}, {"id": "85", "dept": "情報", "imp": ["I", "P"], "crit": ["life"], "vision": "技術を社会で役立てるには、性能だけでなく、使う人の生活がどう変わるかを考えることが大切だと思いました", "text": "今回の話を聞いて、技術を社会で役立てるには、性能だけでなく、使う人の生活がどう変わるかを考えることが大切だと思いました。大学で学んだことを社会でどのように役立てられるか考えたいと思いました。これからは、身近な生活の中で使われている技術にも関心を持ち、利用する人の立場を意識しながら勉強していきたいです。そのためには開発する側と利用する側の両方の視点が必要だと感じました。今後、技術を学ぶ中でも、知識を身につけるだけでなく、使う人の生活がどう変わるかを考えていきたいです。"}, {"id": "86", "dept": "情報", "imp": ["G"], "crit": [], "vision": "同じ情報でも、見せ方を変えると見る人の理解や印象が変わるのではないかと感じました", "text": "シータラムさんのお話を聞いて、GISと3Dメガネを組み合わせるという発想が面白いと思いました。特に、なぜ壁一面に広がる大きさにしたのか、そこにどんな工夫があったのかを聞いてみたいです。また、同じ情報でも、見せ方を変えると見る人の理解や印象が変わるのではないかと感じました。今回の話をきっかけに、GISがほかにどのような場面で使われているのかや、こうしたものを作るときにどんなことを大切にしているのかも気になりました。"}, {"id": "87", "dept": "情報", "imp": ["P"], "crit": [], "vision": "単に技術力や知識を追求するだけでなく、それをどのような社会課題の解決に活かすのかという視点を持つことが、これからのエンジニアに求められている", "text": "今回のシータラムさんのお話を聞いて、異文化や多様なバックグラウンドを持つ人と協働する際の視野の広さや、エンジニアとしての柔軟な姿勢の重要性を強く実感しました。単に技術力や知識を追求するだけでなく、それをどのような社会課題の解決に活かすのかという視点を持つことが、これからのエンジニアに求められているのだと深く学びました。\n質問として、海外と日本の開発現場で一番文化の違いを感じた点について伺いたいです。"}, {"id": "88", "dept": "ロボ", "imp": ["W", "E", "D", "P"], "crit": [], "vision": "成功とは自分自身が成果を得ることだけではなく、次の世代を育て、他者の成長を支えることにもあると学びました", "text": "今回の講義を通じて、社会の課題を解決するためには、専門的な知識や技術だけでなく、問題の本質を理解し、周囲の人々と協力して取り組む姿勢が重要だと感じました。特に印象に残ったのは、シータラムさんが水や衛生の問題に長年取り組み、World Toilet Dayの普及や教育支援など、さまざまな方法で社会に貢献してきたことです。また、問題解決は一度の取り組みで完了するものではなく、実施した結果を振り返り、必要であれば問題の設定や解決策そのものを見直すことが大切だという話も興味深かったです。さらに、教育について、知識や技術を身につけるだけでなく、人格や倫理観を育て、社会にどのような貢献ができるかを考えることが重要だという考えにも共感しました。私自身も、大学で学んでいることを自分のためだけに使うのではなく、将来は周囲の人や社会の課題を解決するために活用したいと思いました。今回の講義から、成功とは自分自身が成果を得ることだけではなく、次の世代を育て、他者の成長を支えることにもあると学びました。"}, {"id": "89", "dept": "ロボ", "imp": ["E"], "crit": [], "vision": "自分は人生の4分の１も教育に費やすのはよくないと思います", "text": "自分は人生の4分の１も教育に費やすのはよくないと思います。なぜなら、多くの人が同じように育ち何かに特化した人材が生まれにくくなると思ったからです。例を挙げると魚君です。彼は、自分が好きな魚だけど自ら学び魚に特化した人になりました。これらのことから、人はどれか熱中しやすいものを見つけそれに真剣に向き合う方が良いと思います。最後に、シータラムさんは、日本に来て感動したこととかあるんですか？例えば、海外に比べて静かなど"}, {"id": "90", "dept": "情報", "imp": ["$", "P"], "crit": [], "vision": "人は課題ではなく課題を解決する人にお金を出すというお言葉", "text": "特に、人は課題ではなく課題を解決する人にお金を出すというお言葉と、成功を質素さと社会貢献で捉え直すという考え方が印象に残りました。私は情報分野を学んでおり、技術だけでなく人格や目的意識も大切だと改めて感じました。私自身もAIを日々の学習や活動に活用していますが、使い方次第で結果が大きく変わると感じています。そこで質問です。AIが急速に発展する中で、技術者を目指す学生は、専門知識に加えて人格や目的意識をどのように身につければよいでしょうか。"}, {"id": "93", "dept": "ロボ", "imp": ["B", "R", "W"], "crit": [], "vision": "技術や想いだけでは社会実装が叶わない現実の難しさを教えてくれました", "text": "シーサ・ラム博士のお話を聞き、型にはまらないキャリアと柔軟な思考法に強く感銘を受けました。特にアイデアがあっても資金の使い方や経営が分からず倒産に至ったというスタートアップの話は、技術や想いだけでは社会実装が叶わない現実の難しさを教えてくれました。  \n​一方で、その失敗や試行錯誤が後のインド新幹線のような巨大プロジェクトや公衆衛生の活動にどう活かされたのかに興味が湧きました。英語があまり分からなく講義中に既にお話しされていたら大変恐縮ですが、倒産時の具体的な体験談や、その教訓をその後の挑戦にどのように還元されたのかを詳しく伺いたいです。"}, {"id": "95", "dept": "ロボ", "imp": ["X"], "crit": [], "vision": "自分から積極的に行動することが大切だと感じました", "text": "今回の授業で、シータラムさんから、将来のことやこれまでの経験について、さまざまなお話を聞くことができ、とても貴重な経験になりました。特に、将来について考えることや、自分から積極的に行動することが大切だと感じました。また、さまざまな経験をすることで、自分の考え方や視野も広がっていくと思いました。今回のお話を参考にして、これからの大学生活でも新しいことに挑戦し、自分の将来について考えていきたいと思います。"}, {"id": "96", "dept": "情報", "imp": ["E"], "crit": [], "vision": "単に資金や物資を寄付するだけでなく、現地の親自身が学校運営に関わる形を作ることで、経済的な理由で子どもが教育を諦めずに済む環境が生み出されています", "text": "今回の話で特に印象的だったのは、教育についてです。\n工学の人からのお話ということでどんな技術や経験を聞けるのかなと考えていたので、教育に関する話が始まった時、予想外のところから来たぞと驚きました。シータラムさんは持続的な教育支援に力を入れていて、「保護者が掃除などを手伝うことで学費を免除する」ことで貧困地域に学校を建てたという話には、面白いと強く興味を惹かれました。単に資金や物資を寄付するだけでなく、現地の親自身が学校運営に関わる形を作ることで、経済的な理由で子どもが教育を諦めずに済む環境が生み出されています。よく、貧困地域へお金を寄付するだけでは結局問題の先延ばしにしかなっていないという批判の声を耳にすることがあるのですが、こういう現地の方へ知識、知恵を支援をすることはとても良い施策だと思いました。幅広く学問を修めてきたシータラムさんのような方にしか出来ないことなんだろうなと思います。広い視野で学びを深めることの大切さと、その学びをどのように社会や人に役立てるかという視点の重要性を学びました。\n\nシータラムさんに質問です。授業中に質問できなくて申し訳ありませんでした。\n保護者の方々に清掃などの作業を提供してもらうことで生徒の学費を無償化する仕組みは非常に素晴らしいと感じたのですが、学校運営において教員の方々への給与の支払いは不可欠であると考えます。教員の人件費や学校の維持費といった実際の資金は、具体的にどのような方法（行政からの補助、外部の助成金、あるいは別の事業収益など）で賄われ、持続されているのでしょうか。"}, {"id": "97", "dept": "ロボ", "imp": ["G", "B", "D"], "crit": [], "vision": "エンジニアとして活動するための専門的な知識と、会社を運営するための知識を両立できたら、どれほど素晴らしいだろうと感じました", "text": "今回の講義で特に印象に残ったのは、GISの研究に早い時期から携わり、三次元での表示など、新しい技術の研究に取り組んでいたという話です。その後の話の、自分で会社を設立したものの、アイデアがたくさんあっても会社の運営がうまくいかず、半年ほどで倒産してしまったという経験も印象的でした。これらの話を聞いて、エンジニアとして活動するための専門的な知識と、会社を運営するための知識を両立できたら、どれほど素晴らしいだろうと感じました。また、アイデアを思いついてプロトタイプを作っても、最初から良いものができるとは限らず、何度も最初に戻って作り直すことも大切なプロセスだという話も興味深かったです。これは、エジソンの「失敗は成功の基」という言葉にも通じるものがあり、エンジニアの世界では試行錯誤を繰り返すことが重要なのだと改めて実感しました。自分も今後、安全な範囲で失敗を恐れず、にさまざまなことに挑戦し、幅広い知識を身につけていきたいと思います。\n質問：プロの、アイデア出しとプロトタイプ作りがどんなものなのか気になります。"}, {"id": "98", "dept": "情報", "imp": ["$", "P", "B"], "crit": [], "vision": "将来は、自分の持っている技術を自分のためだけに使うのではなく、社会や人の役に立てられる人になりたいと思った", "text": "シータラムさんの話を聞いて、技術や知識を身につけることだけでなく、それを使って人の役に立つことが大切だと感じた。特に印象に残ったのは、お金を稼ぐ人を成功者と考えるのではなく、多くの人の役に立った人を成功者と考えるという話である。プログラミングなどの専門的な技術があっても、それだけでは十分ではなく、人の気持ちを考える力や人格も必要だという考えに共感した。また、アイデアがたくさんあっても経営の知識がなければ事業を続けることが難しいという話から、専門分野以外のことも学ぶ必要があると分かった。大学では自分の専門分野を学ぶことが中心になりがちだが、幅広い知識や考え方も身につけていきたい。将来は、自分の持っている技術を自分のためだけに使うのではなく、社会や人の役に立てられる人になりたいと思った。"}], "sections": [{"type": "bars", "field": "imp", "verb": "に触れた", "hot": ["P", "$"], "kicker": "心に残ったもの", "h2": "技術だけでは、世界に貢献できない", "lead": "感想に書かれた話題を数えました（1人が複数を挙げた場合はそれぞれ数えています）。棒をクリックすると、その話題を書いた人の文章が開きます。", "labels": {"P": "技術だけでは足りない（人格・情熱・倫理）", "D": "試作して、振り出しに戻る", "I": "インフラの成功の測り方", "$": "「お金＝成功」ではない", "E": "教育と次の世代（フィリピンの学校）", "W": "水とトイレの問題", "R": "インドの高速鉄道とオリンピック", "Q": "QOL・寿命と幸せ", "G": "GIS・3Dの地図・昔の開発", "C": "経歴（東大・アジア開発銀行）", "B": "スタートアップの倒産と経営", "T": "高めあうチーム", "L": "英語の壁", "X": "その他"}, "callout": {"big": "18", "html": "「技術や知識だけでは足りない。人格、情熱、倫理が要る」という話に触れた人が<b>18人</b>で、いちばん多くなりました。「お金を儲ける＝成功、ではない」（13人）、「次の世代を育てる」（13人）と合わせると、工学の講義で、生き方の話を持ち帰った人が多かった回です。"}}, {"type": "flips", "fq": "BEFORE", "bq": "AFTER", "kicker": "ひっくり返った思い込み", "h2": "カードをめくると、講義の前と後", "lead": "「成功とは稼ぐことだと思っていた」「最初にきっちり計画を立てないと不安」。博士の話で、何がひっくり返ったのかを並べます。", "cards": [{"ft": "成功とは、<br>良い会社に入って稼ぐこと。", "bt": "世の中を良くできたら、それが成功。", "bn": "<b>13</b>人がこの話に触れた。ただし「社会の価値観を変えるのは簡単ではない」と問い返した人も"}, {"ft": "エンジニアの仕事は、<br>技術や建物をつくること。", "bt": "お金の仕組み、ルール、暮らす人の協力まで考えるのが仕事。", "bn": "<b>18</b>人が「技術だけでは足りない」と書いた"}, {"ft": "最初に完璧な計画を<br>立ててから作る。", "bt": "作って、だめなら振り出しに戻る。それが大切なプロセス。", "bn": "<b>14</b>人が試作と振り出しの話に触れた。「計画がないと不安」だった人は、博士の冒険心に勇気をもらった"}]}, {"type": "bars", "field": "crit", "verb": "を挙げた", "hot": ["fair"], "gold": true, "kicker": "成功のものさし", "h2": "速さと費用の、その先にある9本のものさし", "lead": "講義では、インフラの成功を速さや費用だけで測らない、という話がありました。レポートの中で挙がった「成功のものさし」を数えました（20人が1本以上挙げています）。棒をクリックすると、そのものさしを挙げた人の文章が開きます。", "labels": {"life": "暮らしがどう変わったか", "eco": "地域経済への波及（雇用・土地の価値）", "pol": "ルールと人々の協力（政策・管理）", "fund": "お金の仕組み（資金・維持費）", "sym": "国の発展の象徴になるか", "safe": "安全に使えるか", "env": "環境への配慮", "fair": "利益が誰に届くか（公平さ）", "disas": "災害に強く、長持ちするか"}, "callout": {"big": "3", "html": "「利益が誰に、どれだけ公平に届いたか」まで書いた人は<b>3人</b>でした。駅から遠い地域、運賃を払えない人、土地を持たない人には、利益が届きにくい。高速鉄道の「その先」を考えた、数は少ないけれど大事な視点です。"}}, {"type": "questions", "kicker": "手を挙げられなかった質問", "h2": "17人が、博士に聞きたいことを書いた", "lead": "博士は講義で「質問しないのは失礼」という話をしていました（No.17が書いています）。授業中に手を挙げられなかった人も、レポートには質問を書いています。そのままの言葉で集めました。カードをクリックすると、その人の文章全体が読めます。", "cats": {"society": "社会のしくみとお金", "proto": "失敗と試作", "life": "生き方と挑戦", "tech": "技術と文化"}, "items": [{"id": "05", "cat": "life", "q": "シータラムさんがこれまでの経験の中で、特に大変だったことや、それをどのように乗り越えたのかについて質問してみたいです。"}, {"id": "13", "cat": "life", "q": "どうしたらそういう挑戦をしようと思って挑戦することができるのか"}, {"id": "22", "cat": "proto", "q": "失敗したプロトタイプから改善のヒントを見つけ出すために、シータラムさんはどのような基準で評価・観察されているのかが気になりました。"}, {"id": "24", "cat": "society", "q": "より多くの人が目先の利益やお金だけを追い求めるのではなく、他者の幸せや社会全体を豊かにすることにも価値を感じ、行動するようになるためには、どのような意識改革や取り組みが必要だと考えますか。"}, {"id": "29", "cat": "life", "q": "倫理観を重視されるシータラムさんが、エンジニアリングの世界を選ばれた理由をお聞かせください。"}, {"id": "39", "cat": "life", "q": "グローバルな課題と向き合う中で、「一番重要だと感じていること」あるいは「課題に対して解決に近づいてきたときにうれしいと感じること」ってなにかあったりしますか？"}, {"id": "47", "cat": "society", "q": "インフラ整備によって生まれる地域間の格差を減らすためには、どのような取り組みが必要なのでしょうか。"}, {"id": "50", "cat": "society", "q": "安全で丈夫なインフラを作るにはお金がかかると思いますが、お金があまりない国や地域に広がっていくためにはどんな工夫が必要でしょうか？"}, {"id": "67", "cat": "society", "q": "地方の公共交通は鉄道もバスも問題を抱えているが、第三の道はあるのか？"}, {"id": "72", "cat": "proto", "q": "今までで最も難しかった仕事や高かった壁はなんでしたか？"}, {"id": "86", "cat": "tech", "q": "なぜ壁一面に広がる大きさにしたのか、そこにどんな工夫があったのかを聞いてみたいです。"}, {"id": "87", "cat": "tech", "q": "海外と日本の開発現場で一番文化の違いを感じた点について伺いたいです。"}, {"id": "89", "cat": "tech", "q": "シータラムさんは、日本に来て感動したこととかあるんですか？"}, {"id": "90", "cat": "life", "q": "AIが急速に発展する中で、技術者を目指す学生は、専門知識に加えて人格や目的意識をどのように身につければよいでしょうか。"}, {"id": "93", "cat": "proto", "q": "倒産時の具体的な体験談や、その教訓をその後の挑戦にどのように還元されたのかを詳しく伺いたいです。"}, {"id": "96", "cat": "society", "q": "教員の人件費や学校の維持費といった実際の資金は、具体的にどのような方法（行政からの補助、外部の助成金、あるいは別の事業収益など）で賄われ、持続されているのでしょうか。"}, {"id": "97", "cat": "proto", "q": "プロの、アイデア出しとプロトタイプ作りがどんなものなのか気になります。"}]}, {"type": "voices", "kicker": "ていねいに読みたい14の声", "h2": "一文に、その人の見方がある", "lead": "多数派の意見ではなく、ほかの人が書いていない視点や、講義の話を自分の体験につなげた文章を選びました。番号は名簿と関係なくランダムに振っています。", "items": [{"id": "28", "tag": "誰の利益か", "quote": "駅から遠い地域や土地を持たない人には利益が届きにくく、家賃の上昇などで負担だけが増える可能性もある", "comment": "土地の価値が上がった分をインフラの資金に回す、という博士の話を受けて、その利益が誰に届き、誰が負担するのかまで考えています。第1回の「多人称の射程」にもつながる見方です。"}, {"id": "44", "tag": "ギブの仕組み", "quote": "お金ではなく、人が「ギブ」し合うことで成り立つ仕組みがあるのだと驚いた", "comment": "フィリピンの学校が親のボランティアで20年以上続いているという話から、お金以外で回る仕組みに目を留めています。「成功とは良い会社に入って稼ぐことだと思っていた」と、自分の考えの変化も書いています。"}, {"id": "96", "tag": "持続を問う", "quote": "教員の人件費や学校の維持費といった実際の資金は、具体的にどのような方法", "comment": "学校の仕組みに感心したうえで、では先生の給料はどう賄っているのか、と続けるための条件を問うています。感心で終わらず、仕組みの弱いところを確かめようとする質問です。"}, {"id": "20", "tag": "計画と冒険", "quote": "私にとっては結果が未知の状態は最初のうちにきっちりプランを作らないと安心できないのですが", "comment": "印刷するまで正しいかわからない地図づくりの話を、計画を立てないと不安になる自分と比べています。前回のアリーシャさんとの共通点（冒険心）にも気づいています。"}, {"id": "07", "tag": "人生の設計", "quote": "完璧を目指すより、小さく作って改善を重ねるほうが続きます", "comment": "QOLの話を、システム設計の考え方で読み直しています。「QOLは余白から生まれる」という言い方も、ほかの人にない表現です。"}, {"id": "56", "tag": "長い時間", "quote": "100歳まで葛藤しながら生き続ける中にこそ、人間的な深みや人生の後半で予期せぬ変化や素敵な出会いが訪れる余地が存在します", "comment": "「65歳で満足して終えるか、100歳まで生きるか」という問いに、納得のいかない時間にも価値がある、と答えています。「納得できる人生」を選んだ人がいる中での、別の見方です。"}, {"id": "89", "tag": "少数意見", "quote": "自分は人生の4分の１も教育に費やすのはよくないと思います", "comment": "博士が投げかけた「人生の4分の1を教育制度の中で過ごす意味」に、はっきり反対の立場で答えています。好きなことを自分で学んだ人の例を挙げて、理由まで書いています。"}, {"id": "67", "tag": "安全が先", "quote": "時速1500キロでも10回に1回事故が起こるようではインフラとしては成立しませんが、300キロでも安心して使えるのならばそちらのほうが良い", "comment": "速さよりも安全が先、ということを極端な数字の比較で言い切っています。地方の公共交通に「第三の道はあるか」という質問も鋭いです。"}, {"id": "55", "tag": "認識の違い", "quote": "生活環境や文化の違いによる根本的な認識の違いは意識しないと配慮できないなと思いました", "comment": "立場の違いだけでなく、暮らしてきた環境の違いが「衛生」の感覚を変える、と整理しています。仕組みをデザインするときの落とし穴を言い当てています。"}, {"id": "81", "tag": "成功体験", "quote": "これを糧に、最近の自分は精力的だ、と自分に自信を持って活動できるようになってきた", "comment": "博士の「成功体験」という言葉を、自分の大学生活に引き寄せています。正直な書き出しから、自分の変化を確かめています。"}, {"id": "19", "tag": "重ねる", "quote": "たくさんの人々の希望に応えようとするマインドは私が楽しいイラストを描いて人々を喜ばせようとする心理と似ている", "comment": "博士の鉄道への情熱を、イラストを描いて人を喜ばせたい自分の気持ちと重ねています。規模の違う話を、自分の言葉で受け止めています。"}, {"id": "04", "tag": "次の受講へ", "quote": "次回からは、気になった言葉に印を付けて、聞きながら質問を考えるようにし、自分から積極的に参加できる受講を心がけたいです", "comment": "メモに集中して質問できなかったことを振り返り、次の講義での具体的な工夫まで決めています。"}, {"id": "86", "tag": "見せ方", "quote": "同じ情報でも、見せ方を変えると見る人の理解や印象が変わるのではないかと感じました", "comment": "GISと3Dメガネで壁一面に地図を映した話から、見せ方が理解を変えることに気づいています。データを扱う情報系の学生らしい視点です。"}, {"id": "59", "tag": "技術と倫理", "quote": "データや被害予測を専門家だけのものにせず、地域の人々と視点を一致させて対話するために設計されています", "comment": "大きな地図の可視化を、地域の人と同じものを見て話すための工夫として読んでいます。技術と倫理を、具体的な道具の設計で結びつけています。"}]}], "close": {"h2": "「お金じゃない成功」の、その先へ", "p": "いちばん多く持ち帰られたのは「技術だけでは足りない」（18人）と「お金を儲ける＝成功、ではない」（13人）でした。次は、それを自分がつくるものに当てはめてみましょう。", "qs": [["成功の問い", "あなたが「世の中を良くした」と言えるのは、どんな瞬間ですか。"], ["ものさしの問い", "あなたがつくるものの成功を、速さと費用以外の何で測りますか。"], ["質問の問い", "次のゲストに、手を挙げて聞きたいことは何ですか。"]]}, "foot": "集計・分類はAIがレポートを読んで付けた目安で、教員が確認・修正する前提のものです。引用は原文のまま載せ、氏名・学籍番号は載せていません。表示番号は名簿の順番とは関係なく、ほかの回の番号とも対応していません。教員あての個人的なお願いを書いた1件は、その部分を除いて載せています。"};

    pencil: (() => {
      const a = 35 * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      const P = ps => ps.map(([x, y]) => [x * ca - y * sa + 15, x * sa + y * ca + 10]);
      return [
        { share: .52, closed: true, pts: P([[-34, -3], [-8, -3], [0, 0], [-8, 3], [-34, 3]]) },
        { share: .05, pts: P([[-29, -3], [-29, 3]]) },
        { share: .05, pts: P([[-8, -3], [-8, 3]]) },
        { share: .38, pts: range(48, t => [-17 + 32 * t, 10 + 1.5 * Math.sin(t * Math.PI * 6)]) },
      ];
    })(),
    // a water drop falling into two ripples
    drop: [
      { share: .5, closed: true, pts: range(72, t => { const u = t * Math.PI * 2; return [11 * Math.sin(u) * Math.sin(u / 2), -13 * Math.cos(u) - 5]; }) },
      { share: .22, closed: true, pts: range(48, t => [12 * Math.cos(t * Math.PI * 2), 11 + 2.2 * Math.sin(t * Math.PI * 2)]) },
      { share: .28, closed: true, pts: range(60, t => [19 * Math.cos(t * Math.PI * 2), 11.5 + 3.6 * Math.sin(t * Math.PI * 2)]) },
    ],
  };
  const polys = SHAPES[DATA.meta.shape].map(p => {
    const v = p.closed ? p.pts.concat([p.pts[0]]) : p.pts, seg = v.slice(1).map((q, i) => Math.hypot(q[0] - v[i][0], q[1] - v[i][1]));
    return { v, seg, len: seg.reduce((a, b) => a + b, 0), share: p.share };
  });
  function at(p, t) {
    let d = t * p.len, k = 0;
    while (k < p.seg.length - 1 && d > p.seg[k]) { d -= p.seg[k]; k++; }
    const a = p.v[k], b = p.v[k + 1], f = p.seg[k] ? d / p.seg[k] : 0;
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  function shapePoint(i, n) {
    const counts = polys.map(p => Math.round(p.share * n)); counts[counts.length - 1] = n - counts.slice(0, -1).reduce((a, b) => a + b, 0);
    let k = 0; while (i >= counts[k] && k < counts.length - 1) { i -= counts[k]; k++; }
    return at(polys[k], (i + .5) / counts[k]);
  }
  function size() { dpr = window.devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function setShape() {
    if (!W || !H) return;
    const sc = W > 860 ? Math.min(W * .4, H * .9) / 40 : (W - 32) / 44, cx = W > 860 ? W * .72 : W * .5, cy = W > 860 ? H * .46 : H * .62;
    pts.forEach(p => { const [x, y] = shapePoint(p.order, pts.length); p.tx = (cx + x * sc) / W; p.ty = (cy + y * sc) / H; if (/shape/.test(location.search)) { p.x = p.tx; p.y = p.ty; } });
  }
  function frame() {
    if (cv.clientWidth !== W || cv.clientHeight !== H) { size(); if (mode === "shape") setShape(); }
    if (!W || !H) { requestAnimationFrame(frame); return; }
    ctx.clearRect(0, 0, W, H);
    pts.forEach((p, i) => {
      if (mode === "shape") { p.x += (p.tx - p.x) * .045; p.y += (p.ty - p.y) * .045; }
      else { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > 1) p.vx *= -1; if (p.y < 0 || p.y > 1) p.vy *= -1; }
      if (!isFinite(p.x) || !isFinite(p.y)) { p.x = Math.random(); p.y = Math.random(); }
      const X = p.x * W, Y = p.y * H, on = i === hover;
      const col = p.s.dept === "情報" ? "255,138,107" : "93,214,203";
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, p.r * (on ? 6 : 4));
      g.addColorStop(0, `rgba(${col},${on ? .9 : .55})`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, p.r * (on ? 6 : 4), 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(${col},1)`; ctx.beginPath(); ctx.arc(X, Y, on ? p.r + 2 : p.r * .7, 0, 7); ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  cv.parentElement.addEventListener("mousemove", e => {
    const b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    hover = -1; let best = 18 * 18;
    pts.forEach((p, i) => { const d = (p.x * W - mx) ** 2 + (p.y * H - my) ** 2; if (d < best) { best = d; hover = i; } });
    if (hover >= 0) {
      const s = pts[hover].s; tip.innerHTML = `<b>No.${s.id}</b>（${deptName(s.dept)}）<br>${esc(s.vision)}`;
      tip.style.left = Math.min(mx + 14, W - 290) + "px"; tip.style.top = (my + 14) + "px"; tip.style.opacity = 1;
    } else tip.style.opacity = 0;
  });
  cv.parentElement.addEventListener("mouseleave", () => { hover = -1; tip.style.opacity = 0; });
  document.getElementById("gather").onclick = () => { setShape(); mode = "shape"; };
  document.getElementById("scatter").onclick = () => { mode = "free"; pts.forEach(p => { p.vx = (Math.random() - .5) * .002; p.vy = (Math.random() - .5) * .002; setTimeout(() => { p.vx /= 3; p.vy /= 3; }, 900); }); };
  window.addEventListener("resize", () => { size(); if (mode === "shape") setShape(); });
  size(); frame();
  if (/shape/.test(location.search)) { setShape(); mode = "shape"; }
  setTimeout(() => { setShape(); mode = "shape"; }, 1600);
})();

/* a list of students that expands to the full text on click */
function fillList(listEl, list) {
  listEl.innerHTML = list.map(s => `<div class="m" data-id="${s.id}"><div class="id">No.${s.id}</div>${snip(s.text)}</div>`).join("");
  listEl.querySelectorAll(".m").forEach(m => m.onclick = () => { m.innerHTML = `<div class="id">No.${m.dataset.id}</div>` + esc(byId(m.dataset.id).text); });
}
const drawer = sec => `<div class="drawer"><h3></h3><div class="mini"></div></div>`;
function openDrawer(secEl, title, list) {
  const d = secEl.querySelector(".drawer"); d.querySelector("h3").textContent = title; fillList(d.querySelector(".mini"), list); d.classList.add("open");
}

/* ---------- section renderers ---------- */
const R = {
  // horizontal bars over a per-student list field ("imp" or "crit"); clicking opens the writers
  bars(sec, el) {
    const counts = {}; S.forEach(s => s[sec.field].forEach(k => counts[k] = (counts[k] || 0) + 1));
    const keys = Object.keys(sec.labels).filter(k => counts[k]), order = keys.filter(k => k !== "X").sort((a, b) => counts[b] - counts[a]).concat(keys.includes("X") ? ["X"] : []);
    const max = Math.max(...Object.values(counts));
    el.insertAdjacentHTML("beforeend", `<div class="bars reveal ${sec.gold ? "gold" : ""}">${order.map(k => `<div class="bar${sec.hot.includes(k) ? " hot" : ""}" data-k="${k}"><div class="name">${sec.labels[k]}</div><div class="track"><div class="fill" data-w="${counts[k] / max * 100}%"></div></div><div class="cnt">${counts[k]}</div></div>`).join("")}</div>` + (sec.callout ? `<div class="callout reveal"><div class="big">${sec.callout.big}</div><div>${sec.callout.html}</div></div>` : "") + drawer());
    el.querySelectorAll(".bar").forEach(b => b.onclick = () => {
      el.querySelectorAll(".bar").forEach(x => x.classList.toggle("on", x === b));
      const k = b.dataset.k, list = S.filter(s => s[sec.field].includes(k));
      openDrawer(el, `${sec.labels[k]}　${sec.verb} ${list.length}人`, list);
    });
  },
  flips(sec, el) {
    el.insertAdjacentHTML("beforeend", `<div class="flips">${sec.cards.map(c => `<div class="flip reveal" tabindex="0"><div class="in"><div class="f"><div class="q">${sec.fq}</div><div class="t">${c.ft}</div><div class="tap">クリックしてめくる ↻</div></div><div class="b"><div class="q">${sec.bq}</div><div class="t">${c.bt}</div><div class="n">${c.bn}</div></div></div></div>`).join("")}</div>`);
    el.querySelectorAll(".flip").forEach(f => { const t = () => f.classList.toggle("on"); f.onclick = t; f.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } }; });
  },
  // questions written to the guest, filterable by theme; a card opens the whole report
  questions(sec, el) {
    const n = k => sec.items.filter(q => k === "all" || q.cat === k).length;
    el.insertAdjacentHTML("beforeend", `<div class="chips">${[["all", "すべて"], ...Object.entries(sec.cats)].map(([k, l], i) => `<button class="chip${i ? "" : " on"}" data-k="${k}">${l}<span class="c">${n(k)}</span></button>`).join("")}</div><div class="qwall">${sec.items.map(q => `<div class="qc" data-cat="${q.cat}"><div class="qt">${esc(q.q)}</div><div class="qm"><span>No.${q.id}｜${deptName(byId(q.id).dept)}</span><span class="cat">${sec.cats[q.cat]}</span></div><div class="full">${esc(byId(q.id).text)}</div></div>`).join("")}</div>`);
    el.querySelectorAll(".chip").forEach(b => b.onclick = () => { el.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); el.querySelectorAll(".qc").forEach(c => c.classList.toggle("hide", b.dataset.k !== "all" && c.dataset.cat !== b.dataset.k)); });
    el.querySelectorAll(".qc").forEach(c => c.onclick = () => c.classList.toggle("open"));
  },
  // three rising steps; each holds the students whose report reached that step
  stairs(sec, el) {
    el.insertAdjacentHTML("beforeend", `<div class="stairs">${sec.steps.map((st, i) => { const ids = S.filter(s => s.step === i + 1); return `<div class="step reveal" data-i="${i}" tabindex="0"><div class="lv">STEP ${i + 1}</div><div class="nm">${st.label}</div><div class="d">${st.desc}</div><div class="ct">${ids.length}<small>人</small></div><div class="dots">${ids.map(s => `<span title="No.${s.id}"></span>`).join("")}</div></div>`; }).join("")}</div>${sec.note ? `<div class="note reveal">${sec.note}</div>` : ""}` + drawer());
    el.querySelectorAll(".step").forEach(st => {
      const open = () => { el.querySelectorAll(".step").forEach(x => x.classList.toggle("on", x === st)); const i = +st.dataset.i; openDrawer(el, `${sec.steps[i].label}の段の ${S.filter(s => s.step === i + 1).length}人`, S.filter(s => s.step === i + 1)); };
      st.onclick = open; st.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
    });
  },
  voices(sec, el) {
    el.insertAdjacentHTML("beforeend", `<div class="vgrid">${sec.items.map(v => `<article class="vc reveal"><div class="top"><span>No.${v.id}｜${deptName(byId(v.id).dept)}</span><span class="badge">${v.tag}</span></div><blockquote>${esc(v.quote)}</blockquote><div class="cm">${v.comment}</div><button>全文を読む ▾</button><div class="full">${esc(byId(v.id).text)}</div></article>`).join("")}</div>`);
    el.querySelectorAll(".vc button").forEach(b => b.onclick = () => { const c = b.parentElement; c.classList.toggle("open"); b.textContent = c.classList.contains("open") ? "閉じる ▴" : "全文を読む ▾"; });
  },
};
const main = document.getElementById("main");
DATA.sections.forEach((sec, i) => {
  const el = document.createElement("section");
  el.innerHTML = `<div class="kicker">${String(i + 1).padStart(2, "0")}　${sec.kicker}</div><h2>${sec.h2}</h2><p class="lead">${sec.lead}</p>`;
  main.appendChild(el); R[sec.type](sec, el);
});

/* ---------- count up & reveal ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  e.target.querySelectorAll("[data-count]").forEach(el => {
    const n = +el.dataset.count, small = el.querySelector("small").outerHTML; let t0 = null;
    const step = ts => { if (SHOW_ALL) return; t0 = t0 || ts; const k = Math.min(1, (ts - t0) / 900); el.innerHTML = Math.round(n * (1 - Math.pow(1 - k, 3))) + small; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  e.target.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w);
  io.unobserve(e.target);
}), { threshold: .2 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
function showAll() { document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w); document.querySelectorAll("[data-count]").forEach(el => { el.innerHTML = el.dataset.count + el.querySelector("small").outerHTML; }); }
if (SHOW_ALL) showAll();
</script>
</body>
