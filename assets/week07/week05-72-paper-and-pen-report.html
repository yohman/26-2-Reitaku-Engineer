<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>72人の紙とペン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --ink:#1d2433; --muted:#5d6475; --line:#e6e2da;
  --coral:#e2553a; --coral-soft:#fde8e2; --teal:#1b7f79; --teal-soft:#ddf1ee;
  --gold:#c98a14; --violet:#6c4fb3; --night:#141a28; --night-ink:#f3f1ec;
  --shadow:0 6px 24px rgba(29,36,51,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1a2130; --ink:#eef0f4; --muted:#a3abbb; --line:#2c3446;
    --coral:#ff7a5c; --coral-soft:#3a2420; --teal:#43c1b7; --teal-soft:#16302f;
    --gold:#e7b04a; --violet:#a58cf0; --night:#0b0f18; --night-ink:#f3f1ec;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1a2130; --ink:#eef0f4; --muted:#a3abbb; --line:#2c3446;
  --coral:#ff7a5c; --coral-soft:#3a2420; --teal:#43c1b7; --teal-soft:#16302f;
  --gold:#e7b04a; --violet:#a58cf0; --night:#0b0f18; --night-ink:#f3f1ec;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h2{font-size:clamp(24px,3.4vw,36px);line-height:1.35;margin:0 0 8px;font-weight:900;letter-spacing:.01em}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--coral);margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 28px;max-width:720px}
section{padding:72px 0}
section+section{border-top:1px solid var(--line)}

/* hero */
.hero{position:relative;background:var(--night);color:var(--night-ink);min-height:640px;overflow:hidden;padding:0}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:relative;z-index:2;padding:84px 20px 40px;max-width:1080px;margin:0 auto;pointer-events:none}
.hero .copy *{pointer-events:auto}
.hero .tag{display:inline-block;font-size:13px;letter-spacing:.12em;color:#ffb39f;border:1px solid rgba(255,179,159,.4);border-radius:999px;padding:4px 14px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.2;margin:18px 0 12px;font-weight:900}
.hero h1 em{font-style:normal;color:#ff8a6b}
.hero p{max-width:520px;color:#c9cdd8;margin:0 0 22px}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:#ff8a6b;color:#1b1310}
.btn.ghost{background:transparent;color:var(--night-ink);border:1px solid rgba(255,255,255,.35);margin-left:8px}
.hero .hint{position:absolute;z-index:2;left:0;right:0;bottom:84px;text-align:center;font-size:13px;color:#8d94a6}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:280px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;box-shadow:var(--shadow);opacity:0;transition:opacity .15s}
.tip b{color:var(--coral)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-56px;position:relative;z-index:3}
.stat{background:var(--surface);border-radius:16px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.stat .num{font-size:clamp(30px,4.4vw,44px);font-weight:900;line-height:1.1;color:var(--coral)}
.stat .num small{font-size:16px;margin-left:2px;color:var(--ink)}
.stat .lbl{font-size:13px;color:var(--muted);margin-top:4px}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:220px 1fr 54px;gap:12px;align-items:center;cursor:pointer;border-radius:10px;padding:6px 8px;transition:background .2s}
.bar:hover,.bar.on{background:var(--teal-soft)}
.bar .name{font-weight:700;font-size:15px;line-height:1.45}
.bar .track{height:26px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:6px;background:var(--teal);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bars.gold .fill{background:var(--gold)}
.bar.hot .fill,.bars.gold .bar.hot .fill{background:var(--coral)}
.bar .cnt{font-weight:900;font-size:18px;text-align:right}
.callout{display:flex;gap:18px;align-items:center;background:var(--coral-soft);border-radius:16px;padding:20px 22px;margin:26px 0 0}
.callout .big{font-size:44px;font-weight:900;color:var(--coral);line-height:1;white-space:nowrap}
.drawer{margin-top:18px;display:none}
.drawer.open{display:block}
.drawer h3{font-size:16px;margin:0 0 10px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mini .m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;cursor:pointer}
.mini .m .id{font-size:12px;color:var(--muted);font-weight:700}

/* flips */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.flip{perspective:1000px;height:270px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.flip .f{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.flip .b{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip .q{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.flip .b .q{color:rgba(255,255,255,.75)}
.flip .t{font-size:22px;font-weight:900;line-height:1.45}
.flip .n{font-size:13px}
.flip .n b{font-size:30px;font-weight:900;margin-right:4px}
.flip .tap{font-size:12px;color:var(--muted)}

/* question wall */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:4px;font-weight:500}
.qwall{columns:3 260px;column-gap:14px}
.qc{break-inside:avoid;display:inline-block;width:100%;margin:0 0 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;cursor:pointer}
.qc.hide{display:none}
.qc .qt{font-family:"Shippori Mincho",serif;font-weight:700;font-size:16.5px;line-height:1.7}
.qc .qt::before{content:"Q.";font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;color:var(--coral);margin-right:6px}
.qc .qm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:700}
.qc .cat{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:1px 9px}
.qc .full{display:none;margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px}
.qc.open .full{display:block}

/* stairs */
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}
.step{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;outline:2px solid transparent;transition:outline-color .2s}
.step:hover,.step.on{outline-color:var(--ink)}
.step:nth-child(1){margin-top:110px}
.step:nth-child(2){margin-top:55px}
.step .lv{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.step .nm{font-size:22px;font-weight:900;margin:2px 0}
.step .d{font-size:13px;color:var(--muted);line-height:1.6;min-height:42px}
.step .ct{font-size:40px;font-weight:900;line-height:1.1;margin-top:8px;color:var(--teal)}
.step:nth-child(3) .ct{color:var(--coral)}
.step .ct small{font-size:15px;color:var(--ink);margin-left:2px}
.step .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.step .dots span{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.step:nth-child(3) .dots span{background:var(--coral)}
.note{font-size:14px;color:var(--ink);background:var(--teal-soft);border-radius:14px;padding:14px 18px;margin-top:22px}

/* voices */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.vc{background:var(--surface);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.vc .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.vc .badge{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:2px 10px}
.vc blockquote{margin:0;font-family:"Shippori Mincho",serif;font-size:20px;line-height:1.7;font-weight:700}
.vc blockquote::before{content:"“";color:var(--coral);font-size:30px;margin-right:2px}
.vc .cm{font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px}
.vc .cm::before{content:"読みどころ　";font-weight:900;color:var(--coral);font-size:12.5px}
.vc button{align-self:flex-start;font:inherit;font-size:13px;background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:0}
.vc .full{display:none;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.vc.open .full{display:block}

.close{background:var(--night);color:var(--night-ink);text-align:center}
.close h2{font-size:clamp(26px,4vw,42px)}
.close p{color:#c9cdd8;max-width:640px;margin:10px auto 0}
.close .kicker{color:#ff8a6b}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px;text-align:left}
.qs div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 18px;font-size:15px}
.qs b{display:block;color:#ff8a6b;font-size:13px;margin-bottom:4px}
.foot{font-size:12.5px;color:var(--muted);padding:28px 0 48px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s, transform .8s}
.reveal.in{opacity:1;transform:none}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .flips{grid-template-columns:1fr}
  .stairs{grid-template-columns:1fr}
  .step:nth-child(n){margin-top:0}
  .vgrid{grid-template-columns:1fr}
  .qs{grid-template-columns:1fr}
  .bar{grid-template-columns:130px 1fr 40px}
  .bar .name{font-size:13px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero" id="top">
  <canvas id="sky"></canvas>
  <div class="copy">
    <span class="tag" id="tag"></span>
    <h1 id="h1"></h1>
    <p id="intro"></p>
    <button class="btn" id="gather">ひとつに集める</button><button class="btn ghost" id="scatter">ばらばらに戻す</button>
  </div>
  <div class="hint">↓ 下へ進むと、全体の傾向と、ていねいに読みたい声があります</div>
  <div class="tip" id="tip"></div>
</header>

<div class="wrap">
  <div class="stats reveal" id="stats"></div>
  <div id="main"></div>
</div>

<section class="close">
  <div class="wrap">
    <div class="kicker">次の問い</div>
    <h2 id="closeH"></h2>
    <p id="closeP"></p>
    <div class="qs" id="closeQs"></div>
  </div>
</section>
<div class="wrap foot" id="foot"></div>

<script>
const DATA = {"meta": {"tag": "麗澤流エンジニア 2026｜第5回レポート 全体分析", "h1": "72人の、<br><em>まず紙とペン</em>。", "intro": "アリーシャさんの講義のあとに書いた感想と質問。72人分、21,181字を読みました。光の一つ一つが、一人のレポートです。触れると、その人が持ち帰ったことが見えます。", "shape": "pencil"}, "stats": [{"n": 72, "lbl": "提出（情報システム工学 50／ロボティクス 22）"}, {"n": 16, "lbl": "が「AIや検索の前に、まず自分で考える」と書いた"}, {"n": 21, "lbl": "がアリーシャさんへの質問を書いた"}, {"n": 1, "lbl": "だけが、質問を英語で書いた"}], "students": [{"id": "01", "dept": "ロボ", "imp": ["A"], "step": 3, "vision": "まず自分で考え、その後にAIを活用することで、自分らしい新しいアイデアを生み出していきたいと思いました", "text": "私は何か新しいことに挑戦しようと思ったとき、AIやGoogle検索を使って情報を集めることが多いです。しかし、今回の講義を聞いて、まずは他の人のアイデアや情報を取り入れず、自分の考えだけで作りたいものを形にすることが大切だと感じました。最初からAIや検索に頼ってしまうと、自分では思いつかなかった発想に影響され、自由なアイデアが生まれにくくなると思います。AIに簡単に質問できる今だからこそ、すぐに答えを求めるのではなく、紙とペンを使って自分の頭で考える時間を大切にしたいです。まず自分で考え、その後にAIを活用することで、自分らしい新しいアイデアを生み出していきたいと思いました。"}, {"id": "03", "dept": "情報", "imp": ["C", "F", "V", "K"], "step": 2, "vision": "自分も実際にそれをやるとなった時に諦めずに継続できる力をつけたいと思った", "text": "今回、アリーシャの話を聞いてGoogleやApple、Nianticなどの世界的に有名な企業で働くことの大変さをすごく感じた。女性という社会的に弱い立場から自分のやりたいことに信念を持って仕事に向き合う姿勢がとても凄いと思った。実際の空間に3Dでブロックを表示させたりする映像はどれだけの技術力と努力が必要だったのか想像もつかないぐらいだった。自分も実際にそれをやるとなった時に諦めずに継続できる力をつけたいと思った。"}, {"id": "05", "dept": "情報", "imp": ["L", "G", "K"], "step": 2, "vision": "Googleに就職したいから、その募集の条件みたいなのを調べてできないことをできるように努力するところを本当に尊敬しました", "text": "自分が授業でやっていたことは同じようにプロの人というか、アリーシャさんのようなすごい人も同様に行う手順を学んでいたのかと驚くと同時に、スライドで実際にした時のメモを見せていただいた時に、手順一つ一つの熱量や書く量が自分が今までしたのとは比べものにならないくらい多くて、アリーシャさんを目標にしたいと感じました。その熱量も目標にしたいですが、僕は何より行動力と目標を目指す力が素晴らしいと感じました。Googleに就職したいから、その募集の条件みたいなのを調べてできないことをできるように努力するところを本当に尊敬しました。"}, {"id": "07", "dept": "情報", "imp": ["X"], "step": 1, "vision": "世の中には様々な人がいるのだなぁと思いました。", "text": "世の中には様々な人がいるのだなぁと思いました。\n\n質問したいこととしては、「50年後の世界はどうなっていると思いますか？」ですね。今から50年後となると西暦2076年となる訳ではありますが、その頃にはきっと我々の社会も今から大きな変化を強いられていると思うのです。2026年と1976年が最早別の世界のようなものであるように、2026年と2076年も全く違った物になるでしょう。それについての予想を聴いてみたいです"}, {"id": "08", "dept": "情報", "imp": ["D", "C"], "step": 1, "vision": "その昔の価値観をなくしてどちらの役割にも就ていると聞いてとても感銘を受けました", "text": "アリーシャさんの肩書や幼少期の出来事について詳しく学べました。昔のエンジニアとデザイナーは両立できずどちらか片方にしか属せなかったそうなのですが、その昔の価値観をなくしてどちらの役割にも就ていると聞いてとても感銘を受けました。また、GoogleやポケモンGOにも所属していた経験があり、その時にはどんなプロセスを踏んで開発やアイディアを出してきたのかを知ることができてとても貴重な体験をすることができました。"}, {"id": "11", "dept": "ロボ", "imp": ["X"], "step": 2, "vision": "人間だからこそ生み出せる面白さや感情を動かす要素は大切だと感じた", "text": "アリーシャのように大手企業に勤めている人の話を聞いて、AIが作っているゲームには、人間が作っているゲームと比べて何かが足りないということが分かった。AIは短時間で多くのアイデアを出したり、効率よくゲームを作ったりすることができる。しかし、人間が作るゲームには、プレイヤーを楽しませたいという思いや、細かい部分へのこだわり、作り手ならではの工夫が込められていると思う。技術が進歩してAIでできることが増えても、人間だからこそ生み出せる面白さや感情を動かす要素は大切だと感じた。AIと人間にはそれぞれの良さがあり、うまく組み合わせることがこれからのゲーム制作に必要だと思った。"}, {"id": "12", "dept": "情報", "imp": ["C"], "step": 1, "vision": "環境の違いに適応しながらも、エンジニアとしての軸をブレさせずに進化し続ける柔軟性と飽くなき挑戦心", "text": "GoogleとAppleという世界最高峰のテック企業2社でエンジニアを務めたアリーシャさんの経験談は、非常に刺激的で深い示唆に富んでいました。特に印象的だったのは、両社の「文化やアプローチの違い」です。データの分析を徹底してプロダクトを磨き上げるGoogleと、ユーザー体験と洗練されたデザインの細部に徹底してこだわるApple。それぞれの異なる強みや開発哲学を、最前線の現場で体現してきた彼女の言葉には圧倒的な説得力がありました。環境の違いに適応しながらも、エンジニアとしての軸をブレさせずに進化し続ける柔軟性と飽くなき挑戦心は、職種を問わず、変化の激しい現代を生きるすべてのビジネスパーソンにとって大きな励みとなるものでした。"}, {"id": "13", "dept": "情報", "imp": ["A"], "step": 3, "vision": "まず紙とペンで自分なりのアイデアを形にし、そのあとで足りない部分を調べたり、AIに相談したりする順番を実践したいと思いました", "text": "まず印象に残ったのは、新しいものを生み出す人ほど最初から答えを探しに行かないという姿勢です。私は何かしようと思うと、すぐにAIやGoogleで検索してしまいがちです。しかし、先に他人の情報を取り入れると、どうしてもそれに引っ張られて自分らしい発想が出にくくなると感じました。そこで今後は、自分が何かを作りたいときに、まず紙とペンで自分なりのアイデアを形にし、そのあとで足りない部分を調べたり、AIに相談したりする順番を実践したいと思いました。AIに気軽に聞ける今だからこそ、自分の頭で考える力が大切になると思います。"}, {"id": "15", "dept": "ロボ", "imp": ["F", "C", "H"], "step": 2, "vision": "回りの偏見に惑わされず自分の意志を突き通すことが大事", "text": "私はアリーシャさんの話を聞いて最初に感じたことは、回りの偏見に惑わされず自分の意志を突き通すことが大事にすることが自分の未来の選択肢を広がることにつながるのではないかと感じました。また、appleやgoogleで働いていた人の話を聞けたことはとても貴重な経験になったと思いました。チームの活動が社会に出てからも重要であるということがよりわかる話だったと思いました。さらに、閃いたアイデアをわかりやすく教えられる技術がなければいけないと私は感じました。"}, {"id": "16", "dept": "情報", "imp": ["A", "H", "E"], "step": 2, "vision": "まず自分自身で考え、アイデアを形にすることが大切だと感じました", "text": "アリーシャの話を自動翻訳や洋さんの翻訳を聞いて、何か新しいものを作るときには、最初からAIやインターネットの情報に頼るのではなく、まず自分自身で考え、アイデアを形にすることが大切だと感じました。また、一人で制作するだけでなく、他の人と意見を交換し、協力することで、自分では思いつかなかった発想や新しい可能性が生まれることも学びました。特に、身近なアイデアでも工夫や技術によって多くの人が楽しめるものに発展するという点が印象に残りました。今後は今回学んだことを活かし、自分の発想を大切にしながら、失敗を恐れずさまざまなことに挑戦していきたいと思いました。"}, {"id": "17", "dept": "ロボ", "imp": ["E", "C", "V"], "step": 1, "vision": "第3回に続き今回もゲストの話を聞くことができて、とてもためになる講義だった", "text": "英語がとても苦手で、アリーシャが話していた内容はほとんど聞き取れなかったが、翻訳をしながら進めてくれていたため内容を理解することができた。アリーシャがGoogleやAppleなど、有名な様々な会社に勤めていた経験があることにとても驚いた。また、マインクラフトに関する話や、実際にシミュレーションをした動画についてもとても興味を持てる内容だったと感じた。第3回に続き今回もゲストの話を聞くことができて、とてもためになる講義だった。"}, {"id": "18", "dept": "ロボ", "imp": ["C", "V", "F"], "step": 2, "vision": "技術や能力があっても、性別によって評価に差が生まれてしまうのは問題だと思った", "text": "アリーシャの話を聞いて、Googleやナイアンティックなどの有名な企業で働いてきた経歴がとてもすごいと感じた。Googleは誰もが知っているし、ナイアンティックはポケモンGOをやっているから普段お世話になっています。印象に残ったのは男性が多いエンジニアの世界で、女性という理由だけで少し低く見られることがあるという話だった。技術や能力があっても、性別によって評価に差が生まれてしまうのは問題だと思った。また、そのような環境の中でもさまざまな企業で活躍してきたことから、努力や挑戦することの大切さを学んだ。自分もこれからエンジニアを目指す中で、まずは性別などに関係なく能力を発揮できる環境作りにも目を向けて考えてみたいと思った。"}, {"id": "19", "dept": "情報", "imp": ["C"], "step": 1, "vision": "基礎をしっかり固めてスキルを磨いていくことが大切なんだと改めて思いました", "text": "Googleという企業名を聞くと、普段何気なく使っている検索エンジンやスマートフォンなどのテクノロジーが、私たちの生活や勉強にどれほど深く関わっているのかを改めて実感させられます。内容はすっかり忘れてしまいましたが、世界中から優秀な人が集まる最先端の環境で働いているという話を聞くだけでも、すごく刺激的でカッコいいことだなと感じました。\n\n自分自身もいま、プログラミングやゲーム制作の勉強に少しずつ取り組んでいるので、いつかはこうした巨大な技術やシステムを支えるような、影響力のあるものを作ってみたいという憧れがあります。普段の授業や地道な課題は大変なことも多いですが、基礎をしっかり固めてスキルを磨いていくことが大切なんだと改めて思いました。目の前の目標に向かって、一歩ずつ頑張っていきたいです。"}, {"id": "20", "dept": "ロボ", "imp": ["V", "H"], "step": 2, "vision": "専門的な知識だけでなく、コミュニケーション能力や周りの人と協力する力も身につける必要があると感じました", "text": "今回のお話を聞いて、ポケモンGOを開発している会社の仕事内容や、世界中の人に楽しんでもらえるサービスを提供していることに興味を持ちました。特に、さまざまな国の人が働いており、異なる文化や考え方を持つ人たちと協力して仕事を進めていることが印象に残りました。私も将来は、自分の大学で学んだ知識や技術を生かして、会社の一員として多くの人の役に立つ仕事をしたいと思いました。また、将来働くためには専門的な知識だけでなく、コミュニケーション能力や周りの人と協力する力も身につける必要があると感じました。"}, {"id": "21", "dept": "ロボ", "imp": ["G"], "step": 3, "vision": "工学に関わる企業が今どのような能力を求めているのかを、企業のホームページやインターンシップ情報などを通して調べていきたいです", "text": "アリーシャさんのお話を聞いて、自分が働きたい企業に入るためには、その企業が求めている能力を身につけ、それをきちんとアピールできるかが重要だと学びました。これまでは授業の課題や単位の取得ばかりに意識が向いていましたが、将来を見据えて行動する大切さに気づかされました。これからは、工学に関わる企業が今どのような能力を求めているのかを、企業のホームページやインターンシップ情報などを通して調べていきたいです。そして、その情報を意識しながら授業や研究、アルバイトなど日々の活動に取り組み、自分の強みとして語れる経験を積み重ねていきたいと考えています。"}, {"id": "22", "dept": "ロボ", "imp": ["V", "P", "A"], "step": 2, "vision": "デジタル技術を扱う仕事でも、アナログな方法が発想につながることを知り、興味を持ちました", "text": "今回の講義では、ゲストの方からVR、ARの技術の開発に携わった経験などについての話を聞くことができました。特に印象に残ったのは、アイデアを出す際にデジタルだけに頼らず、実際に紙に書いたり、ものを作ったりしていたことです。デジタル技術を扱う仕事でも、アナログな方法が発想につながることを知り、興味を持ちました。私も今後、何かを考えたり開発したりするときには、一つの方法にこだわらず、さまざまな方法を試しながらアイデアを形にしていきたいと思いました。\n質問：VR、ARのUIにはどう気を遣ったらいいのでしょうか？ただ画面に表示するのとはわけが違うので気になりました。"}, {"id": "24", "dept": "情報", "imp": ["G", "H"], "step": 2, "vision": "自分も調べて有名な企業に入るためにしてきたことが自分にもできることだと思った", "text": "アリーシャがGoogleに入るために勉強してきたことがとても理解できた。自分も調べて有名な企業に入るためにしてきたことが自分にもできることだと思ったので、どういったことが必要なのかを調べていく必要があると思った。アリーシャの話を聞いて仕事をする上で情報の伝達ができないと休んだときや何かあった時にグループに迷惑がかかることが前から理解していたが、より実感することができたのでとてもいい経験になったと思いました。"}, {"id": "25", "dept": "情報", "imp": ["H"], "step": 2, "vision": "どれだけ技術や知識があっても、周りの人とうまくやっていくのは簡単ではないのだと思った", "text": "アリーシャさんの話を聞いて、一番印象に残ったのは、今までの仕事で一番大変だったことが人間関係だったという話。Googleなどの大企業で働いていた人なので、難しい技術を使った仕事や専門的な知識が必要な場面で苦労したのかと思っていた。そのため、人間関係が一番大変だったというのは意外だった。どれだけ技術や知識があっても、周りの人とうまくやっていくのは簡単ではないのだと思った。また、エンジニアはパソコンに向かって作業するイメージが強かったが、実際には人と関わることも多いのだと感じた。自分も将来はエンジニアの仕事に興味があるので、プログラミングなどの勉強だけでなく、人との関わり方も大切にしていきたいと思った。"}, {"id": "26", "dept": "情報", "imp": ["X"], "step": 2, "vision": "自分の当たり前が他の人にとっても当たり前とは限らないため、相手の立場になって考えることが大切だと思いました", "text": "アリーシャの話を聞いて、自分とは異なる環境や考え方を持つ人の経験を知ることは、とても大切だと感じました。自分の普段の生活では、身近な人たちや環境を基準に物事を考えてしまっていたが、今回の話を通して、さまざまな価値観や文化があることを改めて知ることができました。また、自分の当たり前が他の人にとっても当たり前とは限らないため、相手の立場になって考えることが大切だと思いました。アリーシャがこれまでに経験したことで、特に自分に影響を与えた出来事について、もう少し聞いてみたいと思いました。"}, {"id": "27", "dept": "ロボ", "imp": ["E", "T"], "step": 2, "vision": "自分との方向性が違うから辞めるという行動力にエンジニア活動への愛が表れていたように見えました", "text": "もっと英語が聞き取れるようになりたいと思いました。Googleなど一流企業に勤めていた方からのお話を聞けるめったにない機会を逃し悔しい思いです。質問内容も雑ながら思いついてはいたのですが、普段の英語力のなさからも心配で手を上げることができませんでした。話の途中にパソコンを使うよりも話を聞いた方がいいと考えてしまい、それが失敗でした。しかし、英語翻訳に集中して内容を聞き逃すよりかは聞くことに集中してよかったとも思っています。特に私はアリーシャさんの話を聞いてgoogleだけでなく様々な会社に移ったり、現在はgoogleを辞め何をしたいのか考え中ということが印象的でした。自分との方向性が違うから辞めるという行動力にエンジニア活動への愛が表れていたように見えました。\n質問しようと思ってできなかったものですが、本来はアリーシャさんの幼少時代に17歳の気持ちでウェブデザイナーをしていたと聞き、当時からお金を儲けたい気持ちがあったのか気になり質問したかったです。Didn't you ever want to make money when you were a child? Googleも成果は必要ですが、かなり稼ぎの良い一流企業ですから、その環境を手放したのが不思議でした。"}, {"id": "28", "dept": "情報", "imp": ["U", "V"], "step": 3, "vision": "自分にとって便利なものが他の人にも便利とは限らないと気づきました", "text": "アリーシャさんの話では、新しい技術を「役に立ち、参加したくなる体験」にするという考えが印象に残りました。技術は高性能なだけでは使われず、使う人のニーズに合っていて、自分から使いたくなることも大切なのだと感じました。Pokémon GOの制作に関わっていたというお話からも、現実の街を歩くことをゲームにすれば、技術を意識せずに楽しめるのだと改めて思いました。\n\n私が普段使う技術の一つは、スマートフォンの地図アプリです。目的地までの道順や時間がすぐに分かる点は便利です。一方で、自転車で移動しているときは画面を見続けるのが難しく、曲がる場所を確認しにくい点に困ることがあります。\n\nもし地図を読むのが苦手な高齢の方のために設計し直すなら、「200m先を右」のような距離の案内だけでなく、「郵便局の角を右」のように目印を使った案内を増やします。また、文字を大きくして、画面に表示する情報を次に進む方向だけに絞ります。さらに、通った道を記録して「今日はここまで歩けました」と表示すれば、外出が楽しみになり、使い続けたくなると思います。\n\nこの設計を考えて、自分にとって便利なものが他の人にも便利とは限らないと気づきました。使う人のニーズを知るには、意見を聞くだけでなく、実際に使っている様子を観察し、どこで迷うのかを確かめることが必要だと思います。"}, {"id": "32", "dept": "情報", "imp": ["H"], "step": 2, "vision": "自分一人で解決しようとするのではなく、周りの人と意見を交換しながら問題を解決していくことが大切だと思った", "text": "アリーシャさんの話を聞いて、エンジニアはプログラミングやシステムを作る技術だけでなく、人と協力する力も必要な仕事だと感じた。特に、仕事を進める中では、自分一人で解決しようとするのではなく、周りの人と意見を交換しながら問題を解決していくことが大切だと思った。また、技術は常に進歩しているため、新しい知識を学び続ける姿勢も重要だと感じた。自分も大学でプログラミングなどの勉強に取り組み、将来に役立つ技術力やコミュニケーション能力を身につけていきたい。"}, {"id": "33", "dept": "ロボ", "imp": ["G", "A"], "step": 2, "vision": "まずは自分で考えて行動するというのは、これからのAI社会において非常に大切であるのと同時に、自分もできていないと感じることなのでこれを機に実践したいと思った", "text": "自分からGoogleに入社するために、Googleに見合うような自分磨きをしたということは、なかなかできないことだと思った。私は入りたいと思った会社があってもそのように行動できる力はないと思うので、そういう行動をできるのは非常に素晴らしいことだと思った。\n曲げないことは何かという質問に対して、まずは自分で考えて行動するというのは、これからのAI社会において非常に大切であるのと同時に、自分もできていないと感じることなのでこれを機に実践したいと思った。"}, {"id": "34", "dept": "ロボ", "imp": ["C", "K"], "step": 2, "vision": "自分が楽しく仕事をしていけるような会社を探していきたいなと思いました", "text": "アリーシャさんの話を聞いてグーグルで働くこと、入ることってほんとに大変で凄いことなんだなと思いました。　それも今はAIで困った時助けてもらえるけど昔はすべて自力でやらなくてはいけないので　そんな中で作るのが楽しい！とかプログラミングするのが楽しい！ととても仕事を楽しんでいるアリョーシャさんが今後社会で働く上で私たちの理想の社会人なのだろうなと思いました。自分はまだどこで働きたいとかまったく考えていないので今回の話を大事にし自分が楽しく仕事をしていけるような会社を探していきたいなと思いました\nアリョーシャさんに質問なのですが　グーグルで働いていた時とても大変だったりつらいことがあったとは思いますがよろしければ何が大変だったり辛かったことありますか？\nあとやってみたいことや行ってみたい国などはありますか？"}, {"id": "35", "dept": "情報", "imp": ["V", "K"], "step": 2, "vision": "自身もそのような身近なゲームを極めて自分だけの世界を作ってみたいと思った", "text": "アリーシャさんは私の憧れる業界であるゲーム業界で働く人だった。私は彼女の話を聞いて、失敗しても何度も諦めずにゲームの開発を続け、他の会社の人と関わるところがゲームクリエイターでエンジニアである彼女らしくて好印象だった。さらに彼女が関わっているゲームは「Minecraft」などの誰もがよく知るゲームであることを知り、自身もそのような身近なゲームを極めて自分だけの世界を作ってみたいと思った。もし彼女に会ったら、ゲーム開発のどこが楽しいかとどこがつらいかを聞いてみたいです。"}, {"id": "36", "dept": "情報", "imp": ["C", "V"], "step": 1, "vision": "実際に外を歩きながらポケモンを探すというアイデアが、どうやって生まれたのか気になりました", "text": "アリーシャさんの話を聞いて、特にGoogleに入社したことがすごいと思いました。Googleは私も普段から使っているので、その会社に実際に入って働いた人の話を聞けたことが印象に残りました。また、私もゲームが好きなので、よく知っている『ポケモンGO』の開発に関わっていたと聞いて驚きました。実際に外を歩きながらポケモンを探すというアイデアが、どうやって生まれたのか気になりました。自分が作ったものがたくさんのひとにあそばれるのはどうゆう気持ちなのか聞きたい。"}, {"id": "37", "dept": "ロボ", "imp": ["K", "C"], "step": 2, "vision": "実践を積む行為を大切にしたいと考え直しました", "text": "今回の第5回目、麗澤流エンジニアに来てくれたアリーシャさんの話を聞いてみて感じたことの一つは、行動力がものすごく高いと感じました。アリーシャさんがグーグルとNianticの二つの話をあげていたと思いますがこの2つに働いていたことがあるのがすごいと感じました。プログラミングのときのプログラマーの話などを聞き行動力の高さに驚かされました。実践を積んできたアリーシャさんのお話を聞けてよかったと思います。実践を積む行為を大切にしたいと考え直しました。"}, {"id": "38", "dept": "情報", "imp": ["H", "L"], "step": 2, "vision": "社会に出てからも、そのような人との付き合い方も苦労するんだと思いました", "text": "今までで一番大変だったことに仕事ではなくて、人間関係を挙げていることが個人的には意外でした、親切でない人や大切な情報の共有をしない人、自分の成果を横取りするような人はどこの国や会社にもいるし、社会に出てからも、そのような人との付き合い方も苦労するんだと思いました。また、デザイン思考で学んだことをプロたちが行っている姿を見ることが出来て、凄いと思いました。逆に、今までで一番楽しかった、うれしかった仕事や経験を教えてほしいです。"}, {"id": "39", "dept": "ロボ", "imp": ["G", "T"], "step": 2, "vision": "仕事に給料を稼ぐ以上のものを感じられるかも今のところわからない、ですが、今回のお話を聞いて視野が広がりました", "text": "あのグーグルで働いていた方の話を聞くことになるとは、まず思っていなかった。難しい入社試験については、前何かの本で読んだことがあるが、募集要項を全て細部まで読み込み、必要な条件を一つづつ全て満たすというやり方は、あまり思いつかないし、思いついてもできることではないと思った。色々な企業に転職をしたり、それを当然のものとして生きる人生については私はまだよくわからない、当然就職もしたことがないし、仕事に給料を稼ぐ以上のものを感じられるかも今のところわからない、ですが、今回のお話を聞いて視野が広がりました。"}, {"id": "40", "dept": "ロボ", "imp": ["A", "T"], "step": 3, "vision": "AIには頼らず、一端自分で考えてもし出てこなかったら少しヒントを貰うという形で考えていきたいと思います", "text": "アリーシャさんの話を聞いて、頭がいい人の考えを知るとてもいい機会になりました。自分は、解決策を考えるときいつも調べて自分の考えを出さずにいました、ですが、話を聞いてからAIには頼らず、一端自分で考えてもし出てこなかったら少しヒントを貰うという形で考えていきたいと思います。また、話を聞いている中で、なぜgoogleという有名な会社に入社できていたのに、やめていろいろな会社での経験をしてみようと思ったのかが気になりました。"}, {"id": "41", "dept": "ロボ", "imp": ["A", "P", "H"], "step": 2, "vision": "紙とペンを使って自分の考えを形にしていくという話が印象に残りました", "text": "アリーシャさんの話を聞いて、何か新しいものを生み出すためには、最初からAIやGoogleなどに頼るのではなく、まずは自分自身で考えてアイデアを出すことが大切だと感じました。特に、紙とペンを使って自分の考えを形にしていくという話が印象に残りました。また、アイデアを実現するためには、実際に行動して試してみることや、一人だけで取り組むのではなく、周りの人と協力して進めることも重要だと学びました。多くの人が利用するサービスも、さまざまな技術や工夫によって生み出されていることを知り、エンジニアの仕事に興味が深まりました。"}, {"id": "43", "dept": "情報", "imp": ["S", "U", "V"], "step": 2, "vision": "エンジニアはつくる人であると同時に、使う人の立場に立って考える人でもあるべきだと気づかされた", "text": "アリーシャさんの話で一番印象に残ったのは、UCLAで英文学を学んだ人が、GoogleやNiantic Spatialで没入型技術やインタラクションデザインの仕事をしているという経歴だった。私は工学部に入ったので、技術の仕事にはプログラミングや理系の知識が一番大事だと思い込んでいた。でも、ユーザー体験をデザインするには、人が何を感じ、どう行動するかを想像する力が必要で、それは言葉や物語を深く読む英文学の経験とつながっているのではないかと感じた。\n\n特にARや空間コンピューティングのような技術は、画面の中だけでなく、現実の街や人の生活に重なって使われる。だからこそ、技術的に「できる」ことよりも、使う人にとって自然で、役に立ち、楽しいと感じられるかが大切になると思った。エンジニアはつくる人であると同時に、使う人の立場に立って考える人でもあるべきだと気づかされた。"}, {"id": "44", "dept": "情報", "imp": ["K"], "step": 2, "vision": "ただ指示された作業をこなすだけのエンジニアではなく、主体性を持ったエンジニアでなければ本当の意味で価値を生み出せないのだとハッとさせられました", "text": "彼女は自分の信念や意見を大切にしながら、妥協せずにプロダクトや技術に向き合っていると伺い、ただ指示された作業をこなすだけのエンジニアではなく、主体性を持ったエンジニアでなければ本当の意味で価値を生み出せないのだとハッとさせられました。私自身も現在、プログラミングやITの基礎知識、デザイン思考などを学んでいる身ですが、今後は単に技術を覚えるだけでなく、「自分はどう考え、どうアプローチしたいのか」という軸を大切にしながら学習に励みたいと思いました。\n質問したいこと-AIの進化で一番変わったところは何か聞きたい。"}, {"id": "45", "dept": "情報", "imp": ["A", "G", "H"], "step": 2, "vision": "最初から答えを求めるのではなく、自分の考えを紙に書き出してアイデアを形にすることも意識したいです", "text": "今回の授業を通して、新しいことに挑戦するためには、まず自分で考えて行動することが大切だと感じました。普段は何かを調べるときにAIやGoogleに頼りがちですが、最初から答えを求めるのではなく、自分の考えを紙に書き出してアイデアを形にすることも意識したいです。また、Googleに入社するために自分の不足している部分を補おうと努力する姿勢が印象に残りました。プロジェクトの話からも、個人の力だけでなく、仲間と協力して取り組むことの大切さを学びました。"}, {"id": "46", "dept": "情報", "imp": ["G", "K"], "step": 2, "vision": "日々の課題の中でもこれ気になると思ったことは調べて学びを深めるなどをしていきたいです", "text": "自分達とはスケールの違うことを沢山やっていると思ったし思っているけど中身をしっかり見てみると、好奇心がとても凄くさらに普通の人がめんどくさいと思うことも当たり前にこなしそのうえで疑問に思ったことを調べたりするなど自分たちが日々過ごしているより少し成長することが成功の秘訣なんだと感じました。色々な有名な企業に就職するためにもあったらいいなと思うものは努力を惜しまずに取得したり日々の課題の中でもこれ気になると思ったことは調べて学びを深めるなどをしていきたいです"}, {"id": "47", "dept": "情報", "imp": ["G", "K"], "step": 2, "vision": "目標を持つだけでなく、その目標を達成するために自分で必要なことを考え、実際に行動に移して努力を続けられるところが本当にすごいと思います", "text": "アリーシャさんがGoogleに入るという目標に向けて、自力で勉強したという話を聞いて、とても行動力のある人だと思いました。目標を持つだけでなく、その目標を達成するために自分で必要なことを考え、実際に行動に移して努力を続けられるところが本当にすごいと思います。特に、自分から学ぼうとする姿勢が印象に残りました。私も将来の目標を実現するために、今できることを考え、自分から積極的に勉強したり、新しいことに挑戦したりしていきたいと思いました。"}, {"id": "48", "dept": "ロボ", "imp": ["A", "H"], "step": 2, "vision": "プロジェクトが終わっても成果を次の人に渡すという話から、仕事はチームでつなぐものだと思いました", "text": "私は課題が出るとすぐAIや検索で調べてしまいがちなので、先に自分で考える時間を作ることが大切だと感じました。また、プロジェクトが終わっても成果を次の人に渡すという話から、仕事はチームでつなぐものだと思いました。\nまた、プロジェクトが終わっても、それまでの成果を次の人に渡して続けていくという話から、仕事は一人でやるものではなく、チームでつなぐものだと感じました。ロボティクス専攻の私にとっても、チームで作るときに役立つ考え方だと思いまsita."}, {"id": "49", "dept": "情報", "imp": ["C"], "step": 1, "vision": "大学で学んでいることが将来の仕事にどうつながっていくのか興味を持ちました", "text": "アリーシャさんの話を聞いて、Googleでエンジニアとして働くことはすごいことだと思いました。自分も情報系の学部で勉強しているので、実際にエンジニアとして働いている人の話を聞けて参考になりました。特に、大学で学んでいることが将来の仕事にどうつながっていくのか興味を持ちました。自分も将来IT関係の仕事に就きたいと考えているので、今のうちに何を勉強しておけばよいのか聞いてみたいと思いました。また、仕事で大変だと感じることについても知りたいです。"}, {"id": "51", "dept": "情報", "imp": ["S", "G", "U"], "step": 2, "vision": "今学んでいることだけにとらわれず、興味を持ったことに自分から挑戦していくことも大切だと思いました", "text": "今回の講義で印象に残ったのは、社会学を専攻していた女性が、プログラミングを学び、Googleへの就職を実現したという話です。最初から専門的な知識や経験があったわけではなく、自分で必要なことを調べ、目標に向けて行動していたことがすごいと思いました。また、UXデザインの話から、アプリやサービスを作るときには、プログラミングの技術だけでなく、実際に使う人がどう感じるか、どうすれば使いやすくなるかを考えることも大切なのだと感じました。私は情報系を学んでいますが、まだ自分の専門分野についても十分に理解できていない部分があります。今回の講義を通して、今学んでいることだけにとらわれず、興味を持ったことに自分から挑戦していくことも大切だと思いました。これからは、授業で学ぶ知識だけでなく、自分で調べたり実際に試したりすることも意識していきたいです。"}, {"id": "52", "dept": "情報", "imp": ["A"], "step": 2, "vision": "人間ならではの発想はこれからも必要になってくると思うので、利用方法をもう一度考え直していきたいです", "text": "AIがある今、自分で考えて行動するといった機会が少なくなってしまったと感じているので、今回の話を聞いて、AIにできる限り頼らないで、自身の考えのみで生活をすることも重要になってくるのかなと思いました。\n　AIは利便性の高いものであり、利用者も多く、生活必需品レベルで必須となっているからこそ自分で考えて行動することが重要なのだなと感じました。もちろん「AIを使うな」というわけではないですが、人間ならではの発想はこれからも必要になってくると思うので、利用方法をもう一度考え直していきたいです。\n　最後に質問ですが、自身のアイデア創出で「難しいな」と感じたことって何かありますか？"}, {"id": "53", "dept": "情報", "imp": ["P", "L"], "step": 2, "vision": "これまで講義で学んできた方法が、世界の最前線で成果を出しているプロフェッショナルによってリアルに使われていることを知り、自分が今取り組んでいる学びの価値を強く再確認できました", "text": "GoogleやApple、Nianticといった世界最高峰の企業でUI/UXデザイナーとして活躍されてきたゲスト講師、アリーシャさんの講話を聞けるとなった時、私は始まる前から「トップクリエイターからどんな話が聞けるのだろう」とワクワクしていました。\n話では、アリーシャさんのGoogleへの就職の経緯や実際の働き方、手掛けたプロジェクトなど多くのお話を頂きました。その中で特に私の心に刺さったのは、「良いアイデアを考えるためには、とにかく大量の案を出すことが大切だ」ということです。このお話を聞いた瞬間、これは！？と驚きました。なぜなら、その手法は今まさに自分がデザイン思考やイノベーション論の講義で学んできた手法そのものだったからです。これまで講義で学んできた方法が、世界の最前線で成果を出しているプロフェッショナルによってリアルに使われていることを知り、自分が今取り組んでいる学びの価値を強く再確認できました。決して授業内容を疑っていたわけではないのですが、現場で活躍していた方のスタイルと重なったことで、この手法の効果を実感しました。\n今回のアリーシャさんからのお話を経て、日々の学業に対するモチベーションは以前よりも高まっています。今大学で学んでいる知識や手法は、将来の自分を助ける実践的な武器になると確信できたからです。これからの講義や演習においても一つひとつの課題に意欲的に向き合い、将来社会で活かせる力を蓄えていきたいと思っています。\n\n最後に、授業内質問でも投げた質問なのですが、アリーシャさんは、どうやったらそんなにアイデアを複数挙げられるのでしょうか？とにかく書く？連想ゲーム？というのを聞きたいです。アイデアを考えるときに最も重視していることがあれば教えて頂きたいです。"}, {"id": "54", "dept": "ロボ", "imp": ["P", "D", "U"], "step": 3, "vision": "これからは大体の構想を考えたらまず動いてみるといったようにしていきたいです", "text": "今回の授業から、VRやARをはじめとする最先端の現場におけるリアルな経験談を聞け、気づきを得られてよかったです。\nまず一つ目に、プロトタイプ（まず形にすること）が持つ力です。\n何かを始める際、人は細かく考えてしまい作業が止まりがちだったり、企画書だけで「無理」と否定されてしまったりすることがあります。しかし、プロトタイプや簡易的なシミュレーションビデオを作って視覚的に提示すると、周囲の評価や反応を変えられるかもしれないということを学べました。アリーシャさんのようにマインクラフトのディレクターやプロジェクトを動かした背景には、常に「まず作って見せる」というスピーディな行動があり、失敗を恐れず、紙と鉛筆のスケッチからスタートし、何度もブラッシュアップを繰り返す精神の大切さを実感しました。\n二つ目に、デザインとプログラミングとといった「境界線を越えること」の重要性です。\n当時アリーシャさんが言われたような「デザインとプログラミングは別物」といった言葉は、多様なハードウェアやゲームハードに対応する現代のモノづくりにおいては、強力な武器になっています。\nまた、アリーシャさんの「作ったものを体験してもらい、反応を見ることが生きがいだ。」という言葉から、常に「使う人の体験」を第一に考え、技術と意匠を融合させる視点が必要不可欠だということが学べました。\nそういったことから、僕は「まず形にして発信してみる」ということを特に意識していきたいと思いました。\nなぜなら僕はよく本当にこれでいいのか、できなさそう、難しそうといった風にネガティブに考えてしまって全然作業が進められなくなってしまうといったことがあったからです。そのため、これからは大体の構想を考えたらまず動いてみるといったようにしていきたいです。\n今回の学びをよく覚えておいて、これからの考え方、研究に活かしていけるように頑張りたいです。"}, {"id": "56", "dept": "情報", "imp": ["X"], "step": 2, "vision": "今のうちから少しずつ自分の将来について考え、行動していくことが大切だと感じました", "text": "アリーシャさんの話を聞いて、自分の将来について少し考えるきっかけになりました。今までは将来のことをあまり深く考えておらず、まだ先のことだと思っていました。しかし、今回の話を聞いて、今のうちから少しずつ自分の将来について考え、行動していくことが大切だと感じました。また、将来のためには勉強だけでなく、色々なことを経験することも必要だと思いました。これからの大学生活では、今までやったことのないことにも挑戦しながら、自分のやりたいことや目標を見つけていきたいです。"}, {"id": "57", "dept": "情報", "imp": ["C", "H", "K"], "step": 2, "vision": "世界で活躍するためにはコミュニケーション能力や新しいことを学び続ける努力も必要だと分かりました", "text": "グーグルやアップルなどの世界的な企業で働いた経験のあるアリーシャさんの話を聞いて、とても感銘を受けました。特に印象に残ったのは、優れたエンジニアになるためには技術力だけでなく、挑戦する姿勢や周囲と協力する力も大切だということです。僕は、これまで、エンジニアはプログラミングが得意であればよいと思っていました。しかし、アリーシャさんの経験談を聞き、世界で活躍するためにはコミュニケーション能力や新しいことを学び続ける努力も必要だと分かりました。また、失敗を恐れずに挑戦することの重要性についても学びました。大きな企業で働く人でも多くの困難を経験し、それを乗り越えながら成長していることを知り、自分も失敗を前向きに捉えようと思いました。将来の進路についてまだ迷っていますが、アリーシャさんの話を聞いて、世界を舞台に活躍する仕事に興味を持ちました。これからは英語や情報技術の勉強に積極的に取り組み、自分の可能性を広げていきたいと思います。今回のお話は、自分の将来について考える良いきっかけになりました"}, {"id": "59", "dept": "情報", "imp": ["U"], "step": 3, "vision": "AIが作ってくれた土台の上に使う人が手で自由に動かせる操作を組み合わせて、もっと感覚的に使えるようにするのが良いと思います", "text": "アリーシャ・ウンピンコさんのお話を聞いて、新しい技術や使い慣れていないツールをみんなが楽しく便利に使えるように工夫することの大切さがよく分かりました。\n私自身、最近はじめてAIを使ってデザインを作るツールを試してみました。言葉を入力するだけでパッとデザインが出来上がった時はすごく便利だと感じましたが、あとから少し場所を動かそうとすると全体の形が大きく崩れてしまい、使いづらいと感じる部分もありました。\nもしこのツールを新しく作り直すならAIが作ってくれた土台の上に使う人が手で自由に動かせる操作を組み合わせて、もっと感覚的に使えるようにするのが良いと思います。\nちなみにアリーシャさんはVRやARのような最新技術の研究もされているとのことですが、初めて触る人でも迷わずに楽しく使ってもらうためにはどんな工夫が一番大切だとお考えですか。"}, {"id": "61", "dept": "情報", "imp": ["C", "H"], "step": 1, "vision": "自分の将来の働き方や成長に向けたマインドセットを見直す貴重な機会となりました", "text": "アリーシャさんのお話を聞き、先端技術を扱うエンジニアとしての仕事観やキャリアの築き方について多くの学びを得ることができました。特にGoogleやNianticといったグローバル企業での開発現場におけるコミュニケーションのあり方や、チームでの課題解決の考え方が強く印象に残っています。単に高度な技術力を磨くだけでなく、アイデアを具体化するプロセスや他者と協力してプロジェクトを推進する姿勢の大切さを実感しました。大学１年生である今の時期からどのような視点を持って学びを進めるべきか、自分の将来の働き方や成長に向けたマインドセットを見直す貴重な機会となりました。"}, {"id": "62", "dept": "ロボ", "imp": ["P"], "step": 2, "vision": "自分もただアイデアを考えるだけでなく、実際に形にすることに挑戦してみたいです", "text": "アリーシャさんの話を聞いて、自分の好きなことや普段の生活で感じていることを、実際にアプリやゲームの形にできるのがすごいと思いました。紹介されていた作品には、ゲームやお金の管理、音楽など、さまざまなアイデアがあり、身近なことでも工夫すれば便利で楽しいものを作れると感じました。自分もただアイデアを考えるだけでなく、実際に形にすることに挑戦してみたいです。\n質問： アリーシャさんは、作品を作るときに一番苦労したことは何ですか。また、アイデアはどのように考えましたか。"}, {"id": "68", "dept": "情報", "imp": ["A", "H"], "step": 3, "vision": "自分の作りたいものには他の情報をまずは取り入れないという方法を実践したいと思いました", "text": "私は何かしようと思った時、AIやGoogleの検索を使ってしまいがちですが、今回の講義を聞いて自分の作りたいものには他の情報をまずは取り入れないという方法を実践したいと思いました。AIに聞ける今だからこそ自分の力、紙とペンでアイデアを形にすることが大事だと思いました。\nチームで協力する際の関わりずらい人の特徴がとても共感しました。チームで成し遂げた結果を、自分の手柄の様に語る人は私も苦手です。\n大学生のうちに学んでおいた方がいいことや将来する仕事に向けて準備しておくことは何でしょうか。"}, {"id": "69", "dept": "情報", "imp": ["U"], "step": 2, "vision": "技術を身につけることだけを目的とせず、それを誰のために、どのように役立てるのかを考えられる人になりたい", "text": "アリーシャ・ウンピンコの話を今回聞いてみて、技術力だけでなく、人々の生活や社会にどのような価値を与えられるかを重視している点が印象に残った。エンジニアは単に与えられた課題を解決するだけでなく、物事の本質を考え、より良い未来を実現するために行動することが大切だと感じた。また、失敗を恐れずに挑戦し、常に学び続ける姿勢も重要だと思う。私も将来エンジニアを目指すうえで、技術を身につけることだけを目的とせず、それを誰のために、どのように役立てるのかを考えられる人になりたい。"}, {"id": "70", "dept": "情報", "imp": ["G", "T"], "step": 2, "vision": "自分が今いる場所が理想的かどうかにも考える姿勢を見習おうと思います", "text": "私がアリーシャさんの話を聞いて感じたことは事故を見つめることの大切さです。アリーシャさんはGoogleに入社するにあたって要項を満たすために自分で資格を取ったりといった努力をして入社しました。このことから何か目標を達成しようとするときには自分の能力を見つめなおして足りない部分を補ってったりすることが大切だとわかりました。アリーシャさんはその後Googleを退社したそうですが自分が今いる場所が理想的かどうかにも考える姿勢を見習おうと思います。"}, {"id": "71", "dept": "情報", "imp": ["F", "C"], "step": 2, "vision": "アリーシャのおかげで一本道で決めず、いろんな道に進めるようにしたいです", "text": "グーグルで働いてたり、いろいろなところで活躍できていてすごいなと思ったし、何よりまだ女だからとかなどの差別的な発言があるのに少し前なんかもっと言われてたと思うのに、こんなにも大活躍していてその姿勢にものすごく憧れみたいなものを感じました。また\n色々な話を聞いて、これからの自分もどこで働くのかなどまだ決まってなくて、将来があまり一本道で決まらないのですがアリーシャのおかげで一本道で決めず、いろんな道に進めるようにしたいです。"}, {"id": "72", "dept": "情報", "imp": ["K", "H"], "step": 2, "vision": "裏でチームを組むためにも普段から人間関係を築くことが大切なのだなと改めて実感しました", "text": "トップ企業でも、これに限らず「隠してプロジェクトしていた。」とはよく聞くもので、なぜそれを行うのかなと思っていました。しかし、アリーシャさんの言うように企業側がやらせてくれないものがあるので、そう言った中から秘密裏にチームワークを組んで行っていたと言うことを知れて、少し驚きました。自分も、作りたいものは作りたい人なので、そう言う時に裏でチームを組むためにも普段から人間関係を築くことが大切なのだなと改めて実感しました。"}, {"id": "73", "dept": "情報", "imp": ["U", "V"], "step": 2, "vision": "いくら技術がすごくても、使う人が迷ったり楽しめなかったりしたら意味がないんだという当たり前で大切なことに気づかされました", "text": "今まで最新技術と聞くと、プログラムがすごいとか、画面がリアルでかっこいいといった技術そのもののすごさばかりに目がいっていました。ですが、アリーシャさんの話を聞いて、いくら技術がすごくても、使う人が迷ったり楽しめなかったりしたら意味がないんだという当たり前で大切なことに気づかされました。ポケモンGOのように、ただ技術を画面に見せるだけでなく、現実世界に出て歩き回りたくなるような体験そのものをデザインしているからこそ、世界中の人が夢中になったんだと納得しました。\nエンジニアやデザイナーを目指す上で、ただ新しい技術を勉強するだけでなく、それを使って人はどう感じるか、どうすれば簡単に楽しく使えるかという気持ちを一番に考える姿勢を大事にしたいと感じました。"}, {"id": "74", "dept": "情報", "imp": ["S", "U"], "step": 2, "vision": "私も専門を問わず幅広い知識を吸収し、意味のある体験を生み出せる人になりたいと思います", "text": "アリーシャさんの話で特に心に残ったのは、英文学という異分野の学びが体験デザインに生きているという点です。技術を主役にせず、使う人の心を動かす体験を探求する姿勢に感銘を受けました。Googleでの没入技術やHonda、Intuitなどの多様な案件を経て、新しい技術を「役に立つ」形にするのがデザイナーの役割だと学び、私も専門を問わず幅広い知識を吸収し、意味のある体験を生み出せる人になりたいと思います。"}, {"id": "75", "dept": "ロボ", "imp": ["U", "H"], "step": 2, "vision": "これからは、身近なシステムについても、どのような工夫がされているのか考えてみたいなと思う", "text": "アリーシャさんの話を聞いて、システムを設計したりデザインする仕事は、単にプログラムや見た目を作るだけではなく、利用する人の立場に立って考え、問題を解決することが大切なのだと感じた。一つのシステムを完成させるまでには、いろんな人と協力しながら、多くの工夫や試行錯誤が必要なのだと分かった。今回の話で普段何気なく使っているシステムにも、多くの人の考えや努力が詰まっていることに分かった。これからは、身近なシステムについても、どのような工夫がされているのか考えてみたいなと思う。"}, {"id": "76", "dept": "情報", "imp": ["G", "A"], "step": 2, "vision": "すぐに答えを探すのではなく、まずは紙とペンを使って自分で考えることも大切だと思いました", "text": "今回の講義では、いろいろなことを学び、実際に行動してきたアリーシャさんのお話を聞くことができ、とても刺激を受けました。特に、Googleに入るために、自分に足りない部分を見つけ、それを補うために努力してきたところがすごいと思いました。また、何かを始めるときに、まずは自分で考えてみるという考え方も印象に残りました。普段の自分はAIやGoogle検索に頼ることが多いですが、すぐに答えを探すのではなく、まずは紙とペンを使って自分で考えることも大切だと思いました。今回のお話を聞いて、自分もいろいろなことに興味を持ち、失敗を恐れずに挑戦していきたいと思いました。"}, {"id": "79", "dept": "情報", "imp": ["G", "K"], "step": 2, "vision": "できないことを見つけて一つずつできるようにしてきたのだと感じました", "text": "今回のお話を聞いて、GoogleやNianticなどの有名な企業で働いた経験のある方でも、最初から何でもできたわけではなく、できないことを見つけて一つずつできるようにしてきたのだと感じました。特に、「できないことがあっても、すぐにできるようになってくる」というお話が印象に残りました。\n \n新しいことや自分にできないことを見つけたとき、解決するために普段から意識していることや、実際に取り組んでいるプロセスがあれば、ざっくりとでも教えていただきたいです。また、努力を継続することが苦手な人や、最初の一歩を踏み出すことが難しい人に向けて、何かアドバイスがあればぜひお聞きしたいです。"}, {"id": "82", "dept": "情報", "imp": ["A", "U", "H"], "step": 2, "vision": "良い製品は高度な技術だけで作られるのではなく、利用者が理解しやすく使いやすい体験を設計することが重要だと知りました", "text": "今回の講演では、GoogleやApple、Nianticで活躍してきたアリーシャさんの経験を通して、技術だけでなく人の視点で考えることの重要性を学びました。特に印象に残ったのは、AIや検索エンジンに頼る前にまず自分で考え、アイデアを形にすることが大切だという話です。私は普段、分からないことがあるとすぐに検索してしまうことが多いので、自分で考える力も鍛えていきたいと思いました。また、良い製品は高度な技術だけで作られるのではなく、利用者が理解しやすく使いやすい体験を設計することが重要だと知りました。さらに、チームで協力しながら新しい技術に挑戦し続ける姿勢や、自分に足りない部分を学び続ける姿勢にも感銘を受けました。私も大学生活の中で知識や技術だけでなく、課題を発見し解決する力やコミュニケーション能力を身につけ、将来に活かしていきたいです。"}, {"id": "83", "dept": "情報", "imp": ["C", "V", "S", "P"], "step": 2, "vision": "自分のやりたいことを形にして伝えることや、大学で学んだ分野にとらわれずに挑戦することの大切さを学ぶことができました", "text": "Googleに就職していたという話やPokemonGoに関わっていたことなどが驚きました、また、Googleの採用試験の際の資料を見せてもらったり、動画を作ってこういうのを作りたいんですというのを渡し作り始めたこと、大学は工学系では無かったと言うことがいちばん驚きました。海外ではさまざまな会社を渡り歩きながら働くことが、日本と比べて自由な印象を受けました。今回の話を通して、自分のやりたいことを形にして伝えることや、大学で学んだ分野にとらわれずに挑戦することの大切さを学ぶことができました。"}, {"id": "85", "dept": "情報", "imp": ["D", "U", "P", "V"], "step": 2, "vision": "最初から完璧なものを作ろうとするのではなく、まず形にして、そこから改善していくことが大切だと感じた", "text": "今回のアリーシャさんの話を聞いて、デザインとプログラミングの両方を理解することの大切さを感じた。特に印象に残ったのは、見た目をデザインするだけでなく、ユーザーがどこをタップするのか、次にどの画面に進むのかまで細かく考えている点である。使う人の立場に立って考えることが、使いやすいサービスを作るために重要なのだと思った。また、課題を与えられたときに、まずスケッチをしてアイデアを整理するという考え方も参考になった。最初から完璧なものを作ろうとするのではなく、まず形にして、そこから改善していくことが大切だと感じた。さらに、以前は手作業で行っていたコーディングが、現在ではAIによって短時間でできるようになっていることから、技術の進歩によって開発の方法も大きく変化していると分かった。これからは2次元の画面だけでなく、VRなどを活用した3次元の体験も重要になると思う。今回の話を通して、技術を身につけるだけでなく、それを使う人にとって意味のあるものを考え、実際に形にする力を身につけたいと思った。"}, {"id": "86", "dept": "情報", "imp": ["C"], "step": 1, "vision": "大学で学ぶ知識が将来どのような場面で役立つのかを考えるきっかけになった", "text": "GoogleやAppleなどの世界的に有名な企業で働いた経験のある方から、実際の仕事について話を聞くことができた。普段から利用しているサービスや製品に関わる企業なので興味深かったし、そうした企業で働く人の話を直接聞けるのは貴重な機会だったと思う。まだ1年で、専門的な知識もほとんど身についていないため、将来どのような仕事に就きたいのか具体的には決まっていない。しかし、今回の講義を通して、大学で学ぶ知識が将来どのような場面で役立つのかを考えるきっかけになった。"}, {"id": "87", "dept": "ロボ", "imp": ["D", "A", "L", "G"], "step": 3, "vision": "スマホやパソコンでタイピングするより、紙の上でペンを動かした方が、体感として思考を整理しやすい気がする", "text": "講義内で洋先生はデザインとエンジニアリングは対比的に扱われることが多いといった話をされていた。個人的に自分もそうだと思っている。美しさと機能性を、同じ人が作り出すのは難しいと思う。そんな中でアリーシャさんは、デザインとエンジニアリングを両立してこなしているというのがすごいと思った。アイデアを出す際、またはプロトタイプの形として\n、アナログな紙にペンで書く(描く)といった手法が使われていたのが印象的であったし、個人的に共感する部分もあった。「デザイン思考A」でも、アナログな道具を用いることの重要性が説かれていた記憶があるので、具体的に実践されている方の話を聞けて嬉しかった。軸は違うかもしれないが、私も予定や計画を立てるときに、メモはスマホではなく紙にするようにしている。スマホやパソコンでタイピングするより、紙の上でペンを動かした方が、体感として思考を整理しやすい気がする。googleの面接で実際に使われたスライドを見せていただいた事について、アリーシャさんが、このスライドで、このプレゼンで現在のgoogleに臨めば受からないだろうといった旨の話をされていたのが印象的だった。現在のgoogleはより大きな会社であるという意味(当時でも大変大きな企業であったと思うが)と受け取ったが、何事も早い内にチャレンジすることが大切なのだろうと思った。\n\n質問\nデザインとエンジニアリングを両立させる上で、心がけている事などはありますか？また、その際に悩むことなどはありますか？"}, {"id": "88", "dept": "ロボ", "imp": ["E", "F"], "step": 3, "vision": "英語が分かれば、もっと多くのことを学べたのにと悔しく思いました", "text": "アリーシャさんの話は英語だったので、正直なところ、細かい内容までは理解できませんでした。しかし、話している姿は自信にあふれていて、自分の仕事に誇りを持っていることが伝わってきました。\nアリーシャさんはエンジニアとしてグーグルで働いていた女性だと聞き、世界で活躍している人がこんなに身近に感じられるのだと驚きました。同時に、英語が分かれば、もっと多くのことを学べたのにと悔しく思いました。\nこの経験から、英語を勉強することの大切さを実感しました。これからは英語の授業をしっかり受けて、いつか海外の人の話も自分の力で理解できるようになりたいです。"}, {"id": "89", "dept": "情報", "imp": ["G", "K"], "step": 2, "vision": "自分に足らないことを探しながら成長していきたいなと思いました", "text": "今回の講義を聞いて、自分の力でアイデアを形にすることや、新しいことに挑戦する大切さを学びました。特に、目標に向けて自分に足りない部分を補おうとする行動力が印象に残りました。自分も大学生活の中で、さまざまなことに挑戦していき、自分に足らないことを探しながら成長していきたいなと思いました。\n\n質問\n大学生のうちに経験しておいた方がいいことや、身につけておくといいスキルはありますか？また、もし大学生に戻れるとしたら、どのようなことに挑戦したいですか？"}, {"id": "90", "dept": "情報", "imp": ["A"], "step": 2, "vision": "私はいつも、自分で深く考える前に、やりたいことに似た事例を調べたり、AIと壁打ちをしたりしています", "text": "「何かを始めるときは、まず自分で考える」というお話が、これまで自分になかった視点だったので、とても印象に残りました。私はいつも、自分で深く考える前に、やりたいことに似た事例を調べたり、AIと壁打ちをしたりしています。そのため、まずは自分で考える癖をつけたいと感じました。\nまた、アイデアを考えるときに、紙と鉛筆でスケッチするというお話も印象に残りました。そこで質問です。デジタルの時代に、あえてアナログな手法でアイデアを練ることには、デジタルでスケッチするのと比べて、どのような違いがありますか。特に、紙とペンを使う方が優れていると感じる点を教えていただきたいです。"}, {"id": "91", "dept": "情報", "imp": ["V"], "step": 1, "vision": "IT技術には人々を楽しませたり、新しい体験を生み出したりする可能性があると感じました", "text": "アリーシャの話を聞いて、GoogleではVRの開発も行っており、マインクラフトの世界をVRで再現していることが印象に残りました。普段ゲームとして遊んでいるものを、VR技術によって実際にその世界に入り込んだように体験できることに驚きました。今回の話を通して、IT技術には人々を楽しませたり、新しい体験を生み出したりする可能性があると感じました。また、自分も大学で情報技術を学び、将来は新しい価値を生み出せるような開発に携わりたいと思いました。"}, {"id": "92", "dept": "情報", "imp": ["U", "V"], "step": 2, "vision": "私自身もGoogle AI Studioでゲームを作った際に、指示していない機能が追加されることがあり、似たような経験をしていたため共感できました", "text": "今回の講演で印象に残ったのは、ボタンの少ないコントローラーでもMinecraftを遊べるように工夫したという話です。普段使っているコントローラーとは操作方法が異なるため、限られたボタンで多くの操作を実現するには、さまざまな工夫が必要になるのだと感じました。ゲームを作る際には、機能だけでなく、実際に操作する人の使いやすさも考えることが重要なのだと思いました。\nまた、AIが指示されたことだけを実行するのではなく、最終的な完成度を高めるために、自分で判断して機能などを追加することがあるという話も興味深かったです。私自身もGoogle AI Studioでゲームを作った際に、指示していない機能が追加されることがあり、似たような経験をしていたため共感できました。\n今回の講演を通して、新しい技術を活用するだけでなく、それを使う人の立場に立って使いやすい体験を考えることも大切だと感じました。"}, {"id": "94", "dept": "情報", "imp": ["U"], "step": 2, "vision": "技術そのものを見せるのではなく、直感的に触れるUIや、失敗しても安心できる体験設計が、人の自発的な参加を生むのだと感じます", "text": "アリーシャさんの講義を聞いて、最先端技術だからといって複雑な操作を強めるのではなく、使う人の「日常の動作」や「達成したい目的」に寄り添う大切さを学びました。技術そのものを見せるのではなく、直感的に触れるUIや、失敗しても安心できる体験設計が、人の自発的な参加を生むのだと感じます。\n\n今後は「どんな技術か」という視点だけでなく、「使う人がどう感じるか」という観察の眼を持って、便利で自然と夢中になれるデザインを目指したいです。"}, {"id": "95", "dept": "ロボ", "imp": ["A", "K"], "step": 2, "vision": "受け身の姿勢を完全に捨て、自ら明確な開発目標を設定し、どんな困難があっても粘り強く挑戦し続ける意思を持った技術者を目指していく", "text": "工学部の人間として、そして将来ロボットに携わる人間として、まず自ら行動を起こさなければ何も始まらないと感じている。昨今はAIをはじめとする便利な技術が発展しているが、ただツールに頼ったり他人の力を借りたりするだけでは、真の技術力や独自の創造性は身につかない。\n直面する課題から逃げず、自分自身の頭で考え、自らの手で試行錯誤を重ねながら、理想とするロボット開発を成し遂げたい。受け身の姿勢を完全に捨て、自ら明確な開発目標を設定し、どんな困難があっても粘り強く挑戦し続ける意思を持った技術者を目指していく。"}, {"id": "96", "dept": "情報", "imp": ["D", "K"], "step": 2, "vision": "プログラミングとデザインは一緒にできないという考えが一般的だったが、それに疑問を持って両立できると考えていた", "text": "感想\nアリーシャの常識を疑うところ（プログラミングとデザインは一緒にできないという考えが一般的だったが、それに疑問を持って両立できると考えていた）が参考になりました。また、VRでマインクラフトをできるようにする話で、開発の案がマインクラフトの開発者？の人に却下されたが、退勤後に開発を進めていたという話を聞いて、実現させたいことに対しての熱量がすごいなと思いました。\n\n質問\nGoogleなどの大企業ではAIをどのように活用していますか。また、アリーシャは実際にどのような時にAIを使っていますか。"}, {"id": "97", "dept": "情報", "imp": ["D", "L", "T", "H"], "step": 2, "vision": "デザイン畑の方はデザインしかやらないという固定観念が外れたところです", "text": "アリーシャさんのお話を聞いて感じたことの一つはデザイン畑の方はデザインしかやらないという固定観念が外れたところです。私のイメージはデザインはデザイナーがつくり、プログラマーなどがその無理な要望を実現するというイメージを持っていたので、現在のデザイナーは固定観念通りではなくなっていることに驚くとともに、Googleほどの企業ならばそういったスキルは当然であろうという感覚を覚えました。Google関連の話では、Googleは人のために開発をするというようしていたものの、アリーシャさんが退社した頃には意見が食い違うようになったということで、Googleが営利的になりすぎたのだろうかとも思っています。他にはデザイン思考で聞いた、ペルソナというものや、ダブルダイヤモンドに近い実際の運用をみて、デザインの現場で通じる考えなのだなとも感じます。講義の終盤のQAにおいてのチームの秘訣も印象的です。各々の興味や、スキルを知ることはとても大事ですし、手柄をとるような人、内向的な人？とは仕事をしづらいという点でゼミ活動などで参考になるなと思いました。"}, {"id": "99", "dept": "情報", "imp": ["C", "L"], "step": 2, "vision": "デザイン思考の授業で学んでいることがどのような面で生かされるのかということがわかってきた", "text": "アリーシャさんはgoogle、apple、ポケモンゴー開発の会社など様々な会社で務めたりして、さまざまな技術を習得している人の話を聞くことができて、どんどん学んで挑戦していくことの大切さを実感しました。また、アリーシャさんの実際に活動していたチームの写真などを見て、デザイン思考の授業で学んでいることがどのような面で生かされるのかということがわかってきたので、もっとアイデアをまとめるような方法を学んでいこうと感じました。"}], "sections": [{"type": "bars", "field": "imp", "verb": "に触れた", "hot": ["A", "H"], "kicker": "心に残ったもの", "h2": "有名企業の経歴と、紙とペンの話が並んだ", "lead": "感想に書かれた話題を数えました（1人が複数を挙げた場合はそれぞれ数えています）。棒をクリックすると、その話題を書いた人の文章が開きます。", "labels": {"C": "Google・Appleなどの経歴", "H": "人間関係・チームワーク", "A": "「まず自分で考える」（紙とペン）", "V": "VR・マインクラフト・ポケモンGO", "K": "行動力・挑戦する姿勢", "G": "Googleに入るための努力", "U": "使う人の体験をデザインする", "P": "まず形にする・大量のアイデア", "L": "授業（デザイン思考）とのつながり", "D": "デザインとプログラミングの両立", "F": "女性への偏見の中で", "T": "Googleを辞めて転職したこと", "E": "英語の壁", "S": "英文学・社会学からの転身", "X": "その他"}, "callout": {"big": "10 / 16", "html": "「AIや検索の前に、まず自分で考える」に触れた<b>16人</b>のうち、<b>10人</b>が「自分もすぐ調べてしまう」「AIと壁打ちしてしまう」と、自分の習慣を書いています。講義の言葉が、自分ごとになっています。"}}, {"type": "flips", "fq": "BEFORE", "bq": "AFTER", "kicker": "ひっくり返った思い込み", "h2": "カードをめくると、講義の前と後", "lead": "今回も「〜だと思っていた」「〜しがちだった」という書き出しがありました。アリーシャさんの話で、何がひっくり返ったのかを並べます。", "cards": [{"ft": "分からなければ、<br>まずAIや検索に聞く。", "bt": "まず紙とペンで自分の案を形にしてから、AIに聞く。", "bn": "<b>10</b>人が「自分もすぐ調べてしまう」と書いた。聞く順番を入れ替える、と決めた人も"}, {"ft": "デザインとプログラミングは、<br>別の人の仕事。", "bt": "一人で両方をこなす人がいる。常識は疑っていい。", "bn": "<b>4</b>人が「別物だと思っていた」と書いた。ただし「美しさと機能を同じ人が作るのは難しい」と今も感じる人も"}, {"ft": "大企業でいちばん大変なのは、<br>難しい技術。", "bt": "いちばん大変だったのは、人間関係だった。", "bn": "<b>2</b>人が「意外だった」と書いた。チームや人との関わりに触れた人は17人"}]}, {"type": "questions", "kicker": "アリーシャさんへの質問", "h2": "21人が、聞きたいことを書いた", "lead": "レポートに書かれた質問を、そのままの言葉で集めました。英語が聞き取れず、授業中に手を挙げられなかった人の質問もあります。アリーシャさんに届けるときの手がかりにしてください。カードをクリックすると、その人の文章全体が読めます。", "cats": {"career": "キャリアと大学生活", "idea": "アイデアのつくり方", "hard": "大変だったこと・楽しかったこと", "ux": "使う人の体験", "ai": "AIと未来"}, "items": [{"id": "07", "cat": "ai", "q": "50年後の世界はどうなっていると思いますか？"}, {"id": "22", "cat": "ux", "q": "VR、ARのUIにはどう気を遣ったらいいのでしょうか？"}, {"id": "26", "cat": "career", "q": "アリーシャがこれまでに経験したことで、特に自分に影響を与えた出来事について、もう少し聞いてみたいと思いました。"}, {"id": "27", "cat": "career", "q": "当時からお金を儲けたい気持ちがあったのか気になり質問したかったです。Didn't you ever want to make money when you were a child?"}, {"id": "34", "cat": "hard", "q": "グーグルで働いていた時とても大変だったりつらいことがあったとは思いますがよろしければ何が大変だったり辛かったことありますか？"}, {"id": "35", "cat": "hard", "q": "ゲーム開発のどこが楽しいかとどこがつらいかを聞いてみたいです。"}, {"id": "36", "cat": "hard", "q": "自分が作ったものがたくさんのひとにあそばれるのはどうゆう気持ちなのか聞きたい。"}, {"id": "38", "cat": "hard", "q": "逆に、今までで一番楽しかった、うれしかった仕事や経験を教えてほしいです。"}, {"id": "40", "cat": "career", "q": "なぜgoogleという有名な会社に入社できていたのに、やめていろいろな会社での経験をしてみようと思ったのかが気になりました。"}, {"id": "44", "cat": "ai", "q": "AIの進化で一番変わったところは何か聞きたい。"}, {"id": "49", "cat": "career", "q": "今のうちに何を勉強しておけばよいのか聞いてみたいと思いました。"}, {"id": "52", "cat": "idea", "q": "自身のアイデア創出で「難しいな」と感じたことって何かありますか？"}, {"id": "53", "cat": "idea", "q": "アリーシャさんは、どうやったらそんなにアイデアを複数挙げられるのでしょうか？"}, {"id": "59", "cat": "ux", "q": "初めて触る人でも迷わずに楽しく使ってもらうためにはどんな工夫が一番大切だとお考えですか。"}, {"id": "62", "cat": "idea", "q": "作品を作るときに一番苦労したことは何ですか。また、アイデアはどのように考えましたか。"}, {"id": "68", "cat": "career", "q": "大学生のうちに学んでおいた方がいいことや将来する仕事に向けて準備しておくことは何でしょうか。"}, {"id": "79", "cat": "hard", "q": "努力を継続することが苦手な人や、最初の一歩を踏み出すことが難しい人に向けて、何かアドバイスがあればぜひお聞きしたいです。"}, {"id": "87", "cat": "idea", "q": "デザインとエンジニアリングを両立させる上で、心がけている事などはありますか？"}, {"id": "89", "cat": "career", "q": "もし大学生に戻れるとしたら、どのようなことに挑戦したいですか？"}, {"id": "90", "cat": "idea", "q": "デジタルの時代に、あえてアナログな手法でアイデアを練ることには、デジタルでスケッチするのと比べて、どのような違いがありますか。"}, {"id": "96", "cat": "ai", "q": "Googleなどの大企業ではAIをどのように活用していますか。"}]}, {"type": "stairs", "kicker": "「すごい」から「一歩」へ", "h2": "52人が「大切だ」と書き、10人が「次にやること」まで書いた", "lead": "レポートの結びを、3つの段に分けました。どの段が正しいということではありません。ゲストの話を、自分の次の行動に変えるまでの距離を見るためのものです。段をクリックすると、その段の人の文章が開きます。", "steps": [{"label": "出会い", "desc": "すごい、貴重だった、驚いた、で結んだ"}, {"label": "気づき", "desc": "「〜が大切だと思った」と、学びを言葉にした"}, {"label": "一歩", "desc": "自分がやることを具体的に書いた（調べる先、手順、作り直す案）"}], "note": "「一歩」の例：工学系の企業が求める能力を、ホームページやインターン情報で調べる（No.21）。地図アプリを、地図が苦手な高齢の方向けに設計し直す（No.28）。AIのデザインツールに、手で動かせる操作を足す（No.59）。"}, {"type": "voices", "kicker": "ていねいに読みたい14の声", "h2": "一文に、その人の見方がある", "lead": "多数派の意見ではなく、ほかの人が書いていない視点や、講義の話を自分の体験につなげた文章を選びました。番号は名簿と関係なくランダムに振っています。", "items": [{"id": "43", "tag": "英文学", "quote": "ユーザー体験をデザインするには、人が何を感じ、どう行動するかを想像する力が必要で、それは言葉や物語を深く読む英文学の経験とつながっているのではないかと感じた", "comment": "工学部に入って「技術の仕事には理系の知識が一番」と思い込んでいた自分を振り返り、英文学という異分野とUXのつながりを自分で見つけています。"}, {"id": "28", "tag": "作り直す", "quote": "「200m先を右」のような距離の案内だけでなく、「郵便局の角を右」のように目印を使った案内を増やします", "comment": "普段使う地図アプリを、地図が苦手な高齢の方のために設計し直しています。「意見を聞くだけでなく、使っている様子を観察して迷う場所を確かめる」という結びまで、講義の考え方を自分の手で試しています。"}, {"id": "59", "tag": "AIツール", "quote": "言葉を入力するだけでパッとデザインが出来上がった時はすごく便利だと感じましたが、あとから少し場所を動かそうとすると全体の形が大きく崩れてしまい、使いづらいと感じる部分もありました", "comment": "最近使ったAIのデザインツールの使いにくさを具体的に書き、どう作り直すかまで考えています。"}, {"id": "92", "tag": "体験と重ねる", "quote": "私自身もGoogle AI Studioでゲームを作った際に、指示していない機能が追加されることがあり、似たような経験をしていたため共感できました", "comment": "講義の「AIが自分で判断して機能を足すことがある」という話を、自分のゲーム制作の体験と重ねています。ボタンの少ないコントローラーの工夫にも目を留めています。"}, {"id": "87", "tag": "紙の上で", "quote": "スマホやパソコンでタイピングするより、紙の上でペンを動かした方が、体感として思考を整理しやすい気がする", "comment": "「デザインとエンジニアリングは別物」という考えに自分も共感しつつ、両立している人の話を受け止めています。紙にメモを取る自分の習慣と、講義の話を結びつけています。"}, {"id": "25", "tag": "予想とのずれ", "quote": "Googleなどの大企業で働いていた人なので、難しい技術を使った仕事や専門的な知識が必要な場面で苦労したのかと思っていた", "comment": "「いちばん大変だったのは人間関係」という答えを、自分の予想とのずれとして書いています。エンジニア＝パソコンに向かう人、というイメージも書き直しています。"}, {"id": "27", "tag": "英語で質問", "quote": "Didn't you ever want to make money when you were a child?", "comment": "英語が聞き取れず手を挙げられなかった悔しさを書いたうえで、聞きたかった質問を英語で書き残しています。Googleを辞めたことに「エンジニア活動への愛」を読み取っている点も独特です。"}, {"id": "18", "tag": "偏見", "quote": "技術や能力があっても、性別によって評価に差が生まれてしまうのは問題だと思った", "comment": "女性であることで低く見られた、という話を受け止め、自分がエンジニアになったときの環境づくりにまで目を向けています。"}, {"id": "54", "tag": "まず形に", "quote": "僕はよく本当にこれでいいのか、できなさそう、難しそうといった風にネガティブに考えてしまって全然作業が進められなくなってしまうといったことがあったからです", "comment": "プロトタイプで周りの反応を変えた話を、作業が止まりがちな自分の癖と結びつけています。"}, {"id": "53", "tag": "授業とつながる", "quote": "これまで講義で学んできた方法が、世界の最前線で成果を出しているプロフェッショナルによってリアルに使われていることを知り", "comment": "「とにかく大量の案を出す」という話が、デザイン思考やイノベーション論で学んだ手法そのものだったことに気づいています。今の学びの価値を確かめた、と書いています。"}, {"id": "97", "tag": "辞めた理由", "quote": "Googleが営利的になりすぎたのだろうかとも思っています", "comment": "デザイナーへの固定観念が外れたことに加え、アリーシャさんが辞めた理由を自分なりに考えています。ペルソナやダブルダイヤモンドが現場で使われていることにも気づいています。"}, {"id": "72", "tag": "隠れて作る", "quote": "企業側がやらせてくれないものがあるので、そう言った中から秘密裏にチームワークを組んで行っていたと言うことを知れて、少し驚きました", "comment": "退勤後にチームを組んで進めたという話から、作りたいものを作るには普段の人間関係が土台になる、と読み取っています。"}, {"id": "40", "tag": "順番を変える", "quote": "AIには頼らず、一端自分で考えてもし出てこなかったら少しヒントを貰うという形で考えていきたいと思います", "comment": "「AIを使わない」ではなく、「使う順番を変える」という具体的なやり方に落とし込んでいます。"}, {"id": "39", "tag": "仕事とは", "quote": "仕事に給料を稼ぐ以上のものを感じられるかも今のところわからない", "comment": "転職を当然とする生き方が「まだよくわからない」と正直に書いています。わからないことをわからないと書いたうえで、視野が広がったと結んでいます。"}]}], "close": {"h2": "「まず自分で考える」の、その先へ", "p": "いちばん多くの人が自分ごととして持ち帰ったのは「AIや検索の前に、まず自分で考える」（16人）でした。次は、それを毎日の手順にしてみましょう。", "qs": [["順番の問い", "次の課題で、AIに聞く前に、紙に何を書きますか。"], ["体験の問い", "あなたが毎日使う技術で、使う人が迷っているのはどこですか。"], ["一歩の問い", "行ってみたい会社の募集要項を一度読んでみましょう。今の自分に足りないものは何ですか。"]]}, "foot": "集計・分類はAIがレポートを読んで付けた目安で、教員が確認・修正する前提のものです。引用は原文のまま載せ、氏名・学籍番号は載せていません。表示番号は名簿の順番とは関係なく、ほかの回の番号とも対応していません。"};

/* ---------- hero: lights → a shape made of polylines ---------- */
(() => {
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d"), tip = document.getElementById("tip");
  let W, H, dpr, mode = "free", hover = -1;
  const order = S.map((s, i) => i).sort((a, b) => S[a].id.localeCompare(S[b].id));
  const pts = S.map((s, i) => ({ s, order: order.indexOf(i), x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .0006, vy: (Math.random() - .5) * .0006, tx: 0, ty: 0, r: 3 + Math.min(4, s.text.length / 220) }));
  const range = (n, f) => Array.from({ length: n + 1 }, (_, k) => f(k / n));
  const SHAPES = {
    // a pencil leaning down-right, its tip ending a hand-written wavy line
    pencil: (() => {
      const a = 35 * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      const P = ps => ps.map(([x, y]) => [x * ca - y * sa + 15, x * sa + y * ca + 10]);
      return [
        { share: .52, closed: true, pts: P([[-34, -3], [-8, -3], [0, 0], [-8, 3], [-34, 3]]) },
        { share: .05, pts: P([[-29, -3], [-29, 3]]) },
        { share: .05, pts: P([[-8, -3], [-8, 3]]) },
        { share: .38, pts: range(48, t => [-17 + 32 * t, 10 + 1.5 * Math.sin(t * Math.PI * 6)]) },
      ];
    })(),
    // a water drop falling into two ripples
    drop: [
      { share: .5, closed: true, pts: range(72, t => { const u = t * Math.PI * 2; return [11 * Math.sin(u) * Math.sin(u / 2), -13 * Math.cos(u) - 5]; }) },
      { share: .22, closed: true, pts: range(48, t => [12 * Math.cos(t * Math.PI * 2), 11 + 2.2 * Math.sin(t * Math.PI * 2)]) },
      { share: .28, closed: true, pts: range(60, t => [19 * Math.cos(t * Math.PI * 2), 11.5 + 3.6 * Math.sin(t * Math.PI * 2)]) },
    ],
  };
  const polys = SHAPES[DATA.meta.shape].map(p => {
    const v = p.closed ? p.pts.concat([p.pts[0]]) : p.pts, seg = v.slice(1).map((q, i) => Math.hypot(q[0] - v[i][0], q[1] - v[i][1]));
    return { v, seg, len: seg.reduce((a, b) => a + b, 0), share: p.share };
  });
  function at(p, t) {
    let d = t * p.len, k = 0;
    while (k < p.seg.length - 1 && d > p.seg[k]) { d -= p.seg[k]; k++; }
    const a = p.v[k], b = p.v[k + 1], f = p.seg[k] ? d / p.seg[k] : 0;
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  function shapePoint(i, n) {
    const counts = polys.map(p => Math.round(p.share * n)); counts[counts.length - 1] = n - counts.slice(0, -1).reduce((a, b) => a + b, 0);
    let k = 0; while (i >= counts[k] && k < counts.length - 1) { i -= counts[k]; k++; }
    return at(polys[k], (i + .5) / counts[k]);
  }
  function size() { dpr = window.devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function setShape() {
    if (!W || !H) return;
    const sc = W > 860 ? Math.min(W * .4, H * .9) / 40 : (W - 32) / 44, cx = W > 860 ? W * .72 : W * .5, cy = W > 860 ? H * .46 : H * .62;
    pts.forEach(p => { const [x, y] = shapePoint(p.order, pts.length); p.tx = (cx + x * sc) / W; p.ty = (cy + y * sc) / H; if (/shape/.test(location.search)) { p.x = p.tx; p.y = p.ty; } });
  }
  function frame() {
    if (cv.clientWidth !== W || cv.clientHeight !== H) { size(); if (mode === "shape") setShape(); }
    if (!W || !H) { requestAnimationFrame(frame); return; }
    ctx.clearRect(0, 0, W, H);
    pts.forEach((p, i) => {
      if (mode === "shape") { p.x += (p.tx - p.x) * .045; p.y += (p.ty - p.y) * .045; }
      else { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > 1) p.vx *= -1; if (p.y < 0 || p.y > 1) p.vy *= -1; }
      if (!isFinite(p.x) || !isFinite(p.y)) { p.x = Math.random(); p.y = Math.random(); }
      const X = p.x * W, Y = p.y * H, on = i === hover;
      const col = p.s.dept === "情報" ? "255,138,107" : "93,214,203";
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, p.r * (on ? 6 : 4));
      g.addColorStop(0, `rgba(${col},${on ? .9 : .55})`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, p.r * (on ? 6 : 4), 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(${col},1)`; ctx.beginPath(); ctx.arc(X, Y, on ? p.r + 2 : p.r * .7, 0, 7); ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  cv.parentElement.addEventListener("mousemove", e => {
    const b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    hover = -1; let best = 18 * 18;
    pts.forEach((p, i) => { const d = (p.x * W - mx) ** 2 + (p.y * H - my) ** 2; if (d < best) { best = d; hover = i; } });
    if (hover >= 0) {
      const s = pts[hover].s; tip.innerHTML = `<b>No.${s.id}</b>（${deptName(s.dept)}）<br>${esc(s.vision)}`;
      tip.style.left = Math.min(mx + 14, W - 290) + "px"; tip.style.top = (my + 14) + "px"; tip.style.opacity = 1;
    } else tip.style.opacity = 0;
  });
  cv.parentElement.addEventListener("mouseleave", () => { hover = -1; tip.style.opacity = 0; });
  document.getElementById("gather").onclick = () => { setShape(); mode = "shape"; };
  document.getElementById("scatter").onclick = () => { mode = "free"; pts.forEach(p => { p.vx = (Math.random() - .5) * .002; p.vy = (Math.random() - .5) * .002; setTimeout(() => { p.vx /= 3; p.vy /= 3; }, 900); }); };
  window.addEventListener("resize", () => { size(); if (mode === "shape") setShape(); });
  size(); frame();
  if (/shape/.test(location.search)) { setShape(); mode = "shape"; }
  setTimeout(() => { setShape(); mode = "shape"; }, 1600);
})();

/* a list of students that expands to the full text on click */
function fillList(listEl, list) {
  listEl.innerHTML = list.map(s => `<div class="m" data-id="${s.id}"><div class="id">No.${s.id}</div>${snip(s.text)}</div>`).join("");
  listEl.querySelectorAll(".m").forEach(m => m.onclick = () => { m.innerHTML = `<div class="id">No.${m.dataset.id}</div>` + esc(byId(m.dataset.id).text); });
}
const drawer = sec => `<div class="drawer"><h3></h3><div class="mini"></div></div>`;
function openDrawer(secEl, title, list) {
  const d = secEl.querySelector(".drawer"); d.querySelector("h3").textContent = title; fillList(d.querySelector(".mini"), list); d.classList.add("open");
}

/* ---------- section renderers ---------- */
const R = {
  // horizontal bars over a per-student list field ("imp" or "crit"); clicking opens the writers
  bars(sec, el) {
    const counts = {}; S.forEach(s => s[sec.field].forEach(k => counts[k] = (counts[k] || 0) + 1));
    const keys = Object.keys(sec.labels).filter(k => counts[k]), order = keys.filter(k => k !== "X").sort((a, b) => counts[b] - counts[a]).concat(keys.includes("X") ? ["X"] : []);
    const max = Math.max(...Object.values(counts));
    el.insertAdjacentHTML("beforeend", `<div class="bars reveal ${sec.gold ? "gold" : ""}">${order.map(k => `<div class="bar${sec.hot.includes(k) ? " hot" : ""}" data-k="${k}"><div class="name">${sec.labels[k]}</div><div class="track"><div class="fill" data-w="${counts[k] / max * 100}%"></div></div><div class="cnt">${counts[k]}</div></div>`).join("")}</div>` + (sec.callout ? `<div class="callout reveal"><div class="big">${sec.callout.big}</div><div>${sec.callout.html}</div></div>` : "") + drawer());
    el.querySelectorAll(".bar").forEach(b => b.onclick = () => {
      el.querySelectorAll(".bar").forEach(x => x.classList.toggle("on", x === b));
      const k = b.dataset.k, list = S.filter(s => s[sec.field].includes(k));
      openDrawer(el, `${sec.labels[k]}　${sec.verb} ${list.length}人`, list);
    });
  },
  flips(sec, el) {
    el.insertAdjacentHTML("beforeend", `<div class="flips">${sec.cards.map(c => `<div class="flip reveal" tabindex="0"><div class="in"><div class="f"><div class="q">${sec.fq}</div><div class="t">${c.ft}</div><div class="tap">クリックしてめくる ↻</div></div><div class="b"><div class="q">${sec.bq}</div><div class="t">${c.bt}</div><div class="n">${c.bn}</div></div></div></div>`).join("")}</div>`);
    el.querySelectorAll(".flip").forEach(f => { const t = () => f.classList.toggle("on"); f.onclick = t; f.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } }; });
  },
  // questions written to the guest, filterable by theme; a card opens the whole report
  questions(sec, el) {
    const n = k => sec.items.filter(q => k === "all" || q.cat === k).length;
    el.insertAdjacentHTML("beforeend", `<div class="chips">${[["all", "すべて"], ...Object.entries(sec.cats)].map(([k, l], i) => `<button class="chip${i ? "" : " on"}" data-k="${k}">${l}<span class="c">${n(k)}</span></button>`).join("")}</div><div class="qwall">${sec.items.map(q => `<div class="qc" data-cat="${q.cat}"><div class="qt">${esc(q.q)}</div><div class="qm"><span>No.${q.id}｜${deptName(byId(q.id).dept)}</span><span class="cat">${sec.cats[q.cat]}</span></div><div class="full">${esc(byId(q.id).text)}</div></div>`).join("")}</div>`);
    el.querySelectorAll(".chip").forEach(b => b.onclick = () => { el.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); el.querySelectorAll(".qc").forEach(c => c.classList.toggle("hide", b.dataset.k !== "all" && c.dataset.cat !== b.dataset.k)); });
    el.querySelectorAll(".qc").forEach(c => c.onclick = () => c.classList.toggle("open"));
  },
  // three rising steps; each holds the students whose report reached that step
  stairs(sec, el) {
    el.insertAdjacentHTML("beforeend", `<div class="stairs">${sec.steps.map((st, i) => { const ids = S.filter(s => s.step === i + 1); return `<div class="step reveal" data-i="${i}" tabindex="0"><div class="lv">STEP ${i + 1}</div><div class="nm">${st.label}</div><div class="d">${st.desc}</div><div class="ct">${ids.length}<small>人</small></div><div class="dots">${ids.map(s => `<span title="No.${s.id}"></span>`).join("")}</div></div>`; }).join("")}</div>${sec.note ? `<div class="note reveal">${sec.note}</div>` : ""}` + drawer());
    el.querySelectorAll(".step").forEach(st => {
      const open = () => { el.querySelectorAll(".step").forEach(x => x.classList.toggle("on", x === st)); const i = +st.dataset.i; openDrawer(el, `${sec.steps[i].label}の段の ${S.filter(s => s.step === i + 1).length}人`, S.filter(s => s.step === i + 1)); };
      st.onclick = open; st.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
    });
  },
  voices(sec, el) {
    el.insertAdjacentHTML("beforeend", `<div class="vgrid">${sec.items.map(v => `<article class="vc reveal"><div class="top"><span>No.${v.id}｜${deptName(byId(v.id).dept)}</span><span class="badge">${v.tag}</span></div><blockquote>${esc(v.quote)}</blockquote><div class="cm">${v.comment}</div><button>全文を読む ▾</button><div class="full">${esc(byId(v.id).text)}</div></article>`).join("")}</div>`);
    el.querySelectorAll(".vc button").forEach(b => b.onclick = () => { const c = b.parentElement; c.classList.toggle("open"); b.textContent = c.classList.contains("open") ? "閉じる ▴" : "全文を読む ▾"; });
  },
};
const main = document.getElementById("main");
DATA.sections.forEach((sec, i) => {
  const el = document.createElement("section");
  el.innerHTML = `<div class="kicker">${String(i + 1).padStart(2, "0")}　${sec.kicker}</div><h2>${sec.h2}</h2><p class="lead">${sec.lead}</p>`;
  main.appendChild(el); R[sec.type](sec, el);
});

/* ---------- count up & reveal ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  e.target.querySelectorAll("[data-count]").forEach(el => {
    const n = +el.dataset.count, small = el.querySelector("small").outerHTML; let t0 = null;
    const step = ts => { if (SHOW_ALL) return; t0 = t0 || ts; const k = Math.min(1, (ts - t0) / 900); el.innerHTML = Math.round(n * (1 - Math.pow(1 - k, 3))) + small; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  e.target.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w);
  io.unobserve(e.target);
}), { threshold: .2 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
function showAll() { document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w); document.querySelectorAll("[data-count]").forEach(el => { el.innerHTML = el.dataset.count + el.querySelector("small").outerHTML; }); }
if (SHOW_ALL) showAll();
</script>
</body>
